  function startMultiStreamGame(game) {
    var mc = document.getElementById('mc');
    if (!mc) return;
    mc.classList.add('fullscreen-game');
    var questions = game.msQuestions || [];
    if (!questions.length) {
      alert('אין שאלות מוגדרות! הגדר שאלות בממשק המנהל.');
      mc.classList.remove('fullscreen-game');
      return;
    }
    var s = getGameSettings(game);
    var maxQ = s.questionsPerSession || 8;
    var selected = questions.slice().sort(function() { return Math.random() - 0.5; }).slice(0, Math.min(maxQ, questions.length));
    var state = {
      gameId: game.id, game: game,
      questions: selected, current: 0,
      score: 0, correct: 0, totalAnswers: 0, correctAnswers: 0,
      studyMode: !!window._studyMode,
      log: []
    };

    mc.innerHTML = '<div class="game-wrapper"><div class="card" id="ms-shell" style="padding:0;overflow:hidden;max-width:900px;margin:0 auto;width:100%"></div></div>';
    showGameExitButton && showGameExitButton();
    var exitBtn = document.getElementById('game-exit-btn');
    if (exitBtn) exitBtn.onclick = function() {
      mc.classList.remove('fullscreen-game');
      hideGameExitButton && hideGameExitButton();
      clearInterval(state._timerInt);
      GAME_REGISTRY.multi_stream.renderLobby(mc, game);
    };

    function renderMSQuestion() {
      var shell = document.getElementById('ms-shell');
      if (!shell) return;
      if (state.current >= state.questions.length) { endMSGame(); return; }

      var q = state.questions[state.current];
      var total = state.questions.length;
      var pct = Math.round((state.current / total) * 100);
      var timeLimit = state.studyMode ? 999 : (s.answerTime || 35);
      var timeLeft = timeLimit;
      var answers = {}; // qIdx -> chosen option index
      var submitted = false;
      var studyBadge = state.studyMode
        ? '<span style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:8px">מצב לימוד</span>'
        : '';

      // q.streamA: { type:'image', src, label }
      // q.streamB: { type:'text', content, label }
      // q.questions: [ { text, options:[], correct:0, streamRef:'A'|'B' }, ... ]
      var sA = q.streamA || {};
      var sB = q.streamB || {};
      var subQs = q.questions || [];

      // Build stream A html
      var streamAHtml = '';
      if (sA.type === 'image') {
        streamAHtml = '<div style="border-radius:8px;overflow:hidden;background:#000">' +
          (sA.src ? '<img src="' + sA.src + '" style="width:100%;max-height:220px;object-fit:cover;display:block">' : '<div style="height:180px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;background:#f0f2f5">אין תמונה</div>') +
          '</div>';
      }

      // Build stream B html
      var streamBHtml = '';
      if (sB.type === 'text') {
        var bAppear = sB.disappearAfter || 0; // seconds, 0 = stays
        streamBHtml = '<div id="ms-stream-b" style="background:#1a1a2e;border-radius:8px;padding:14px 16px;min-height:80px;display:flex;flex-direction:column;justify-content:center">' +
          (sB.label ? '<div style="font-size:10px;font-weight:700;color:#4361ee;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">' + sB.label + '</div>' : '') +
          '<div id="ms-b-content" style="font-size:14px;color:#fff;line-height:1.6;font-weight:500">' + (sB.content || '') + '</div>' +
          (bAppear > 0 ? '<div id="ms-b-timer" style="font-size:11px;color:#888;margin-top:6px">נעלם בעוד <span id="ms-b-sec">' + bAppear + '</span> שניות</div>' : '') +
        '</div>';
      }

      // Build sub-questions html
      var subQsHtml = subQs.map(function(sq, qi) {
        var refLabel = sq.streamRef === 'B' ? sB.label || 'הודעה' : sA.label || 'תמונה';
        var refColor = sq.streamRef === 'B' ? '#4361ee' : '#dc2626';
        return '<div class="ms-subq" data-qi="' + qi + '" style="margin-bottom:12px">' +
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px">' +
            '<span style="background:' + refColor + ';color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px">' + refLabel + '</span>' +
            '<span style="font-size:14px;font-weight:600;color:var(--color-text-primary)">' + sq.text + '</span>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:5px" id="ms-opts-' + qi + '">' +
            sq.options.map(function(opt, oi) {
              return '<button class="ms-opt" data-qi="' + qi + '" data-oi="' + oi + '" onclick="window._msPick(' + qi + ',' + oi + ')" style="text-align:right;padding:9px 14px;background:var(--color-background-secondary);border:1.5px solid var(--color-border-secondary);border-radius:8px;font-size:13px;color:var(--color-text-primary);cursor:pointer;transition:all .12s">' + opt + '</button>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');

      shell.innerHTML =
        '<div style="padding:12px 16px;border-bottom:0.5px solid var(--color-border-tertiary)">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
            '<span style="font-size:13px;color:var(--color-text-secondary)">שאלה ' + (state.current+1) + '/' + total + studyBadge + '</span>' +
            '<span style="font-size:13px;font-weight:700;color:#dc2626">⭐ ' + state.score + '</span>' +
          '</div>' +
          '<div style="height:4px;background:var(--color-background-secondary);border-radius:2px">' +
            '<div style="width:' + pct + '%;height:100%;background:#dc2626;border-radius:2px;transition:width .3s"></div>' +
          '</div>' +
        '</div>' +
        '<div style="padding:12px 16px">' +
          // Two streams side by side on wide, stacked on narrow
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px" id="ms-streams">' +
            '<div>' +
              (sA.label ? '<div style="font-size:10px;font-weight:700;color:#dc2626;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">' + sA.label + '</div>' : '') +
              streamAHtml +
            '</div>' +
            '<div>' + streamBHtml + '</div>' +
          '</div>' +
          '<div id="ms-questions">' + subQsHtml + '</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">' +
            (state.studyMode
              ? '<span style="font-size:12px;color:var(--color-text-tertiary)">מצב לימוד — אין טיימר</span>'
              : '<span style="font-size:13px;color:var(--color-text-secondary)">⏱️ <span id="ms-timer" style="font-weight:700;color:#dc2626">' + timeLeft + '</span> שניות</span>') +
            '<button id="ms-submit" onclick="window._msSubmit()" style="padding:10px 28px;background:#dc2626;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer">שלח תשובות ←</button>' +
          '</div>' +
          '<div id="ms-feedback" style="margin-top:10px;min-height:32px"></div>' +
        '</div>';

      // Responsive: stack on narrow screens
      var streamsGrid = document.getElementById('ms-streams');
      if (streamsGrid && shell.offsetWidth < 500) {
        streamsGrid.style.gridTemplateColumns = '1fr';
      }

      // Stream B disappear timer
      if (sB.disappearAfter && sB.disappearAfter > 0 && !state.studyMode) {
        var bSec = sB.disappearAfter;
        var bInt = setInterval(function() {
          bSec--;
          var bSecEl = document.getElementById('ms-b-sec');
          if (bSecEl) bSecEl.textContent = bSec;
          if (bSec <= 0) {
            clearInterval(bInt);
            var bContent = document.getElementById('ms-b-content');
            var bTimerEl = document.getElementById('ms-b-timer');
            if (bContent) { bContent.style.filter = 'blur(4px)'; bContent.style.opacity = '0.3'; }
            if (bTimerEl) bTimerEl.textContent = '(הוסתר — תוכן זה כבר לא זמין)';
          }
        }, 1000);
      }

      // Main countdown timer
      if (!state.studyMode) {
        state._timerInt = setInterval(function() {
          timeLeft--;
          var tel = document.getElementById('ms-timer');
          if (tel) {
            tel.textContent = timeLeft;
            if (timeLeft <= 5) tel.style.color = '#e63946';
          }
          if (timeLeft <= 0) {
            clearInterval(state._timerInt);
            if (!submitted) { submitted = true; window._msSubmit(true); }
          }
        }, 1000);
      }

      // Pick handler
      window._msPick = function(qi, oi) {
        if (submitted) return;
        answers[qi] = oi;
        // Visual feedback on button selection
        var optsDiv = document.getElementById('ms-opts-' + qi);
        if (optsDiv) {
          optsDiv.querySelectorAll('.ms-opt').forEach(function(btn, i) {
            btn.style.background = i === oi ? '#4361ee' : 'var(--color-background-secondary)';
            btn.style.color = i === oi ? '#fff' : 'var(--color-text-primary)';
            btn.style.borderColor = i === oi ? '#4361ee' : 'var(--color-border-secondary)';
          });
        }
      };

      // Submit handler
      window._msSubmit = function(timedOut) {
        if (submitted && !timedOut) return;
        submitted = true;
        clearInterval(state._timerInt);
        var submitBtn = document.getElementById('ms-submit');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.style.opacity = '0.5'; }

        var qCorrect = 0;
        var qTotal = subQs.length;

        subQs.forEach(function(sq, qi) {
          var chosen = answers[qi];
          var isOk = chosen === sq.correct;
          if (isOk) qCorrect++;
          state.totalAnswers++;
          if (isOk) state.correctAnswers++;

          // Color the options
          var optsDiv = document.getElementById('ms-opts-' + qi);
          if (optsDiv) {
            optsDiv.querySelectorAll('.ms-opt').forEach(function(btn, oi) {
              btn.disabled = true;
              btn.style.cursor = 'default';
              if (oi === sq.correct) {
                btn.style.background = '#d1fae5';
                btn.style.borderColor = '#2dc653';
                btn.style.color = '#065f46';
              } else if (oi === chosen && !isOk) {
                btn.style.background = '#fee2e2';
                btn.style.borderColor = '#e63946';
                btn.style.color = '#991b1b';
              }
            });
          }

          // Show explanation if study mode
          if (state.studyMode && sq.explanation) {
            var subqDiv = document.querySelector('.ms-subq[data-qi="' + qi + '"]');
            if (subqDiv) {
              var expDiv = document.createElement('div');
              expDiv.style.cssText = 'background:#f0f9ff;border-radius:6px;padding:7px 10px;font-size:12px;color:#0369a1;margin-top:6px';
              expDiv.textContent = '💡 ' + sq.explanation;
              subqDiv.appendChild(expDiv);
            }
          }
        });

        // Score: all correct = 10 pts, partial = 5 pts
        var allCorrect = qCorrect === qTotal;
        var anyCorrect = qCorrect > 0;
        var points = 0;
        if (!state.studyMode) {
          if (allCorrect) points = 10;
          else if (anyCorrect) points = 5;
          state.score += points;
        }
        if (allCorrect) state.correct++;

        state.log.push({
          prompt: q.streamA && q.streamA.label ? q.streamA.label : 'שאלה',
          ok: allCorrect,
          partial: anyCorrect && !allCorrect,
          qCorrect: qCorrect,
          qTotal: qTotal
        });

        var feedbackDiv = document.getElementById('ms-feedback');
        if (feedbackDiv) {
          if (timedOut && qCorrect === 0) {
            feedbackDiv.innerHTML = '<div style="background:#fff8e1;border-radius:8px;padding:10px 14px;text-align:center;color:#92400e;font-weight:700">⏰ הזמן נגמר לפני שענית</div>';
          } else if (allCorrect) {
            feedbackDiv.innerHTML = '<div style="background:#d1fae5;border-radius:8px;padding:10px 14px;text-align:center;color:#065f46;font-weight:700">✅ מושלם — ענית נכון על שני הזרמים!' + (points ? ' +' + points + ' נקודות' : '') + '</div>';
          } else if (anyCorrect) {
            feedbackDiv.innerHTML = '<div style="background:#fff8e1;border-radius:8px;padding:10px 14px;text-align:center;color:#92400e;font-weight:700">⚠️ ' + qCorrect + '/' + qTotal + ' נכון' + (points ? ' +' + points + ' נקודות' : '') + '</div>';
          } else {
            feedbackDiv.innerHTML = '<div style="background:#fee2e2;border-radius:8px;padding:10px 14px;text-align:center;color:#991b1b;font-weight:700">❌ לא נכון — ראה תשובות נכונות למעלה</div>';
          }
        }

        setTimeout(function() {
          state.current++;
          renderMSQuestion();
        }, state.studyMode ? 2800 : 2000);
      };
    }

    function endMSGame() {
      mc.classList.remove('fullscreen-game');
      hideGameExitButton && hideGameExitButton();
      var shell = document.getElementById('ms-shell');
      if (!shell) return;
      var total = state.questions.length;
      var correct = state.correct;
      var acc = total ? Math.round((correct / total) * 100) : 0;
      // sub-question accuracy
      var subAcc = state.totalAnswers ? Math.round((state.correctAnswers / state.totalAnswers) * 100) : 0;
      var level = 'מתחיל', lc = 'badge-warning';
      if (acc >= 85) { level = 'מומחה'; lc = 'badge-success'; }
      else if (acc >= 65) { level = 'מתקדם'; lc = 'badge-info'; }
      var r = {
        id: 'r' + Date.now(), userId: currentUser.username, userName: currentUser.name,
        score: state.score, correct: correct, total: total, accuracy: acc, level: level,
        date: new Date().toISOString(), gameType: game.id,
        answerSpeeds: 'sub_accuracy:' + subAcc, avgAnswerTime: '',
        mode: state.studyMode ? 'study' : 'challenge'
      };
      var res = getGameResults(game.id); res.unshift(r); persistGameResults(game.id, res); saveDB();
      sendToSheets(Object.assign({}, r, { gameType: game.id }));
      shell.innerHTML =
        '<div class="results-card" style="padding:32px">' +
          '<div class="result-score">' + r.score + '</div>' +
          '<div class="result-label">נקודות סה"כ</div>' +
          '<div><span class="level-badge ' + lc + '">' + level + '</span></div>' +
          '<div class="result-stats">' +

        streamA: { type: 'image', src: '', label: 'סצנה' },
        streamB: { type: 'text', content: '', label: 'הודעת OTI', disappearAfter: 0 },
        questions: [
          { text: '', options: ['', '', ''], correct: 0, streamRef: 'A', explanation: '' },
          { text: '', options: ['', '', ''], correct: 0, streamRef: 'B', explanation: '' }

    mc.innerHTML = '<div class="game-wrapper"><div class="card" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 48px;max-width:760px;width:100%;margin:0 auto;text-align:center">' +

  function startDragDropGame(game) {
    var mc = document.getElementById('mc');
    if (!mc) return;
    mc.classList.add('fullscreen-game');
    var questions = game.ddQuestions || [];
    if (!questions.length) { alert('אין שאלות מוגדרות במשחק זה! הגדר שאלות בממשק המנהל.'); mc.classList.remove('fullscreen-game'); return; }
    var s = getGameSettings(game);
    var selected = questions.slice().sort(function() { return Math.random() - 0.5; }).slice(0, Math.min(s.questionsPerSession || 10, questions.length));
    var state = { gameId: game.id, game: game, questions: selected, current: 0, score: 0, correct: 0, studyMode: !!window._studyMode, log: [] };

    mc.innerHTML = '<div class="game-wrapper"><div class="card" id="dd-shell" style="padding:0;overflow:hidden;max-width:900px;margin:0 auto;width:100%"></div></div>';
    showGameExitButton && showGameExitButton();
    var exitBtn = document.getElementById('game-exit-btn');
    if (exitBtn) exitBtn.onclick = function() { mc.classList.remove('fullscreen-game'); hideGameExitButton && hideGameExitButton(); GAME_REGISTRY.drag_drop.renderLobby(mc, game); };

    function renderDDQuestion() {
      var shell = document.getElementById('dd-shell');
      if (!shell) return;
      if (state.current >= state.questions.length) { endDDGame(); return; }
      var q = state.questions[state.current];
      var total = state.questions.length;
      var pct = Math.round((state.current / total) * 100);
      var studyBadge = state.studyMode ? '<span style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:8px">מצב לימוד</span>' : '';
      // q.type: 'place_on_image' | 'matching'
      var isMatching = q.type === 'matching';

      if (isMatching) {
        // matching: items array, targets array, correct pairing by index
        var items = (q.items || []).slice().sort(function() { return Math.random() - 0.5; });
        var targets = q.targets || [];
        var placed = {}; // targetIdx -> itemIdx
        var draggedItem = null;

        shell.innerHTML =
          '<div style="padding:14px 16px;border-bottom:1px solid #eee">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
              '<span style="font-size:13px;color:#666">שאלה ' + (state.current+1) + '/' + total + studyBadge + '</span>' +
              '<span style="font-size:13px;font-weight:700;color:#7c3aed">⭐ ' + state.score + '</span>' +
            '</div>' +
            '<div style="height:5px;background:#eee;border-radius:3px"><div style="width:' + pct + '%;height:100%;background:#7c3aed;border-radius:3px"></div></div>' +
          '</div>' +
          '<div style="padding:16px">' +
            '<p style="font-size:16px;font-weight:700;color:#1a1a2e;margin:0 0 16px;text-align:center">' + q.prompt + '</p>' +
            '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
              '<div style="flex:1;min-width:160px">' +
                '<p style="font-size:12px;font-weight:600;color:#888;margin-bottom:8px">פריטים לגרירה:</p>' +
                '<div id="dd-items" style="display:flex;flex-direction:column;gap:8px">' +
                  items.map(function(item, i) {
                    return '<div class="dd-item" draggable="true" data-item="' + i + '" data-label="' + encodeURIComponent(item.label) + '" style="padding:10px 14px;background:#ede9fe;border:1.5px solid #c4b5fd;border-radius:8px;font-size:14px;font-weight:600;color:#5b21b6;cursor:grab;user-select:none;text-align:center">' + item.label + '</div>';
                  }).join('') +
                '</div>' +
              '</div>' +
              '<div style="flex:2;min-width:200px">' +
                '<p style="font-size:12px;font-weight:600;color:#888;margin-bottom:8px">מיקומים:</p>' +
                '<div id="dd-targets" style="display:flex;flex-direction:column;gap:8px">' +
                  targets.map(function(target, ti) {
                    return '<div class="dd-zone" data-target="' + ti + '" style="padding:10px 14px;background:#f8f9ff;border:2px dashed #c4b5fd;border-radius:8px;font-size:13px;color:#666;min-height:44px;display:flex;align-items:center;gap:8px">' +
                      '<span style="font-weight:600;color:#1a1a2e">' + target.label + '</span>' +
                      '<span class="dd-zone-content" style="color:#aaa;font-style:italic">גרור לכאן...</span>' +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div style="text-align:center;margin-top:16px">' +
              '<button id="dd-check" onclick="window._ddCheck()" style="padding:11px 36px;background:#7c3aed;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer">✓ בדוק</button>' +
            '</div>' +
            '<div id="dd-result" style="margin-top:12px;min-height:40px"></div>' +
          '</div>';

        // Drag events
        shell.querySelectorAll('.dd-item').forEach(function(el) {
          el.addEventListener('dragstart', function(e) {
            draggedItem = { idx: parseInt(el.dataset.item), label: decodeURIComponent(el.dataset.label), el: el };
            el.style.opacity = '0.5';
          });
          el.addEventListener('dragend', function() { el.style.opacity = '1'; });
        });
        shell.querySelectorAll('.dd-zone').forEach(function(zone) {
          zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.style.borderColor = '#7c3aed'; });
          zone.addEventListener('dragleave', function() { zone.style.borderColor = '#c4b5fd'; });
          zone.addEventListener('drop', function(e) {
            e.preventDefault();
            zone.style.borderColor = '#c4b5fd';
            if (!draggedItem) return;
            var ti = parseInt(zone.dataset.target);
            placed[ti] = draggedItem.idx;
            var content = zone.querySelector('.dd-zone-content');
            if (content) { content.textContent = draggedItem.label; content.style.cssText = 'color:#5b21b6;font-style:normal;font-weight:600'; }
            zone.style.background = '#ede9fe';
          });
        });

        window._ddCheck = function() {
          var allPlaced = Object.keys(placed).length === targets.length;
          if (!allPlaced && !state.studyMode) { alert('גרור פריטים לכל המיקומים תחילה'); return; }
          var correct = 0;
          targets.forEach(function(target, ti) {
            var placedItemIdx = placed[ti];
            var correctItemLabel = items.find(function(it, ii) { return ii === target.correctItemIdx; });
            // find which shuffled item maps to correctItemIdx
            var isOk = (placedItemIdx !== undefined) && (items[placedItemIdx].correctIdx === ti);
            if (isOk) correct++;
            var zone = shell.querySelector('.dd-zone[data-target="' + ti + '"]');
            if (zone) zone.style.background = isOk ? '#d1fae5' : '#fee2e2';
          });
          var allCorrect = correct === targets.length;
          if (!state.studyMode && allCorrect) state.score += 10;
          if (allCorrect) state.correct++;
          state.log.push({ prompt: q.prompt, ok: allCorrect });
          var resultDiv = document.getElementById('dd-result');
          if (resultDiv) {
            resultDiv.innerHTML = allCorrect
              ? '<div style="background:#d1fae5;border-radius:8px;padding:10px 14px;text-align:center;color:#065f46;font-weight:700">✅ מצוין! כל הזוגות נכונים' + (state.studyMode ? '' : ' +10 נקודות') + '</div>'
              : '<div style="background:#fee2e2;border-radius:8px;padding:10px 14px;text-align:center;color:#991b1b;font-weight:700">❌ ' + correct + '/' + targets.length + ' נכון — המיקומים הנכונים מסומנים בירוק</div>';
          }
          var checkBtn = document.getElementById('dd-check');
          if (checkBtn) { checkBtn.disabled = true; checkBtn.style.opacity = '0.5'; }
          setTimeout(function() { state.current++; renderDDQuestion(); }, state.studyMode ? 2500 : 2000);
        };

  function startSequenceGame(game) {
    var mc = document.getElementById('mc');
    if (!mc) return;
    mc.classList.add('fullscreen-game');
    var questions = game.seqQuestions || [];
    if (!questions.length) { alert('אין תרחישים מוגדרים! הגדר תרחישים בממשק המנהל.'); mc.classList.remove('fullscreen-game'); return; }
    var s = getGameSettings(game);
    var selected = questions.slice().sort(function(){return Math.random()-0.5;}).slice(0, Math.min(s.questionsPerSession||8, questions.length));
    var state = { gameId:game.id, game:game, questions:selected, current:0, score:0, correct:0, studyMode:!!window._studyMode, log:[] };

    mc.innerHTML = '<div class="game-wrapper"><div class="card" id="seq-shell" style="padding:0;overflow:hidden;max-width:900px;margin:0 auto;width:100%"></div></div>';
    showGameExitButton && showGameExitButton();
    var exitBtn = document.getElementById('game-exit-btn');
    if (exitBtn) exitBtn.onclick = function(){ mc.classList.remove('fullscreen-game'); hideGameExitButton&&hideGameExitButton(); GAME_REGISTRY.sequence_order.renderLobby(mc,game); };

    function renderSeqQuestion() {
      var shell = document.getElementById('seq-shell');
      if (!shell) return;
      if (state.current >= state.questions.length) { endSeqGame(); return; }
      var q = state.questions[state.current];
      var total = state.questions.length;
      var pct = Math.round((state.current/total)*100);
      var studyBadge = state.studyMode ? '<span style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:8px">מצב לימוד</span>' : '';
      // Shuffle steps
      var steps = (q.steps || []).slice();
      var shuffled = steps.map(function(s,i){return {text:s.text,image:s.image||'',correctPos:i,currentPos:i};}).sort(function(){return Math.random()-0.5;});

      function renderCards() {
        var cardsDiv = document.getElementById('seq-cards');
        if (!cardsDiv) return;
        cardsDiv.innerHTML = shuffled.map(function(step, si) {
          return '<div class="seq-card" data-idx="' + si + '" draggable="true" style="background:#fff;border:1.5px solid #bae6fd;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:grab;display:flex;align-items:center;gap:10px;user-select:none">' +
            '<span style="background:#0284c7;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0">' + (si+1) + '</span>' +
            (step.image ? '<img src="' + step.image + '" style="height:48px;width:72px;object-fit:cover;border-radius:6px;flex-shrink:0">' : '') +
            '<span style="font-size:14px;color:#1a1a2e;line-height:1.4">' + step.text + '</span>' +
          '</div>';
        }).join('');
        // Drag-to-reorder
        var cards = cardsDiv.querySelectorAll('.seq-card');
        var dragIdx = null;
        cards.forEach(function(card) {
          card.addEventListener('dragstart', function() { dragIdx = parseInt(card.dataset.idx); card.style.opacity='0.5'; });
          card.addEventListener('dragend', function() { card.style.opacity='1'; });
          card.addEventListener('dragover', function(e) { e.preventDefault(); card.style.borderColor='#0284c7'; card.style.background='#f0f9ff'; });
          card.addEventListener('dragleave', function() { card.style.borderColor='#bae6fd'; card.style.background='#fff'; });
          card.addEventListener('drop', function(e) {
            e.preventDefault(); card.style.borderColor='#bae6fd'; card.style.background='#fff';
            var dropIdx = parseInt(card.dataset.idx);
            if (dragIdx === null || dragIdx === dropIdx) return;
            var moved = shuffled.splice(dragIdx, 1)[0];
            shuffled.splice(dropIdx, 0, moved);
            renderCards();
          });
        });
      }

      shell.innerHTML =
        '<div style="padding:14px 16px;border-bottom:1px solid #eee">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
            '<span style="font-size:13px;color:#666">תרחיש ' + (state.current+1) + '/' + total + studyBadge + '</span>' +
            '<span style="font-size:13px;font-weight:700;color:#0284c7">⭐ ' + state.score + '</span>' +
          '</div>' +
          '<div style="height:5px;background:#eee;border-radius:3px"><div style="width:' + pct + '%;height:100%;background:#0284c7;border-radius:3px"></div></div>' +
        '</div>' +
        '<div style="padding:14px 16px">' +
          '<p style="font-size:16px;font-weight:700;color:#1a1a2e;margin:0 0 6px;text-align:center">' + q.prompt + '</p>' +
          '<p style="font-size:13px;color:#888;margin:0 0 12px;text-align:center">גרור את הכרטיסיות לסדר הנכון</p>' +
          '<div id="seq-cards" style="max-width:600px;margin:0 auto"></div>' +
          '<div style="text-align:center;margin-top:14px">' +
            '<button onclick="window._seqCheck()" style="padding:11px 36px;background:#0284c7;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer">✓ בדוק סדר</button>' +
          '</div>' +
          '<div id="seq-result" style="margin-top:12px;max-width:600px;margin-left:auto;margin-right:auto;min-height:40px"></div>' +
        '</div>';

      renderCards();

      window._seqCheck = function() {
        var correct = shuffled.every(function(step, si) { return step.correctPos === si; });
        // partial score: count correct positions
        var partialCorrect = shuffled.filter(function(step,si){return step.correctPos===si;}).length;
        var points = correct ? 10 : (partialCorrect > 0 && !state.studyMode ? Math.floor((partialCorrect/shuffled.length)*10) : 0);
        if (!state.studyMode) state.score += points;
        if (correct) state.correct++;
        state.log.push({ prompt: q.prompt, ok: correct });

        // Color each card
        var cards = document.querySelectorAll('.seq-card');
        shuffled.forEach(function(step, si) {
          var card = cards[si];
          if (!card) return;
          card.style.background = step.correctPos === si ? '#d1fae5' : '#fee2e2';
          card.style.borderColor = step.correctPos === si ? '#2dc653' : '#e63946';
          card.draggable = false;
          card.style.cursor = 'default';
          if (step.correctPos !== si) {
            card.innerHTML += '<span style="font-size:11px;color:#991b1b;margin-right:auto;padding-right:8px"> → מיקום נכון: ' + (step.correctPos+1) + '</span>';
          }
        });

        // In study mode — show correct order
        var resHtml = correct
          ? '<div style="background:#d1fae5;border-radius:8px;padding:10px 14px;text-align:center;color:#065f46;font-weight:700">✅ סדר מושלם!' + (points ? ' +' + points + ' נקודות' : '') + '</div>'
          : '<div style="background:#fee2e2;border-radius:8px;padding:10px 14px;text-align:center;color:#991b1b;font-weight:700">❌ ' + partialCorrect + '/' + shuffled.length + ' במיקום הנכון' + (state.studyMode && q.explanation ? '<br><span style="font-size:12px;font-weight:400;color:#7f1d1d">' + q.explanation + '</span>' : '') + '</div>';
        var resDiv = document.getElementById('seq-result');
        if (resDiv) resDiv.innerHTML = resHtml;
        var checkBtn = document.querySelector('#seq-shell button[onclick="window._seqCheck()"]');
        if (checkBtn) { checkBtn.disabled=true; checkBtn.style.opacity='0.5'; }
        setTimeout(function(){ state.current++; renderSeqQuestion(); }, state.studyMode ? 3000 : 2200);
      };
    }

    function endSeqGame() {
      mc.classList.remove('fullscreen-game');

      var shell = document.getElementById('seq-shell');

  }

  function startHotspotGame(game) {
    var mc = document.getElementById('mc');
    if (!mc) return;
    mc.classList.add('fullscreen-game');
    var hotspots = game.hotspots || [];
    var questions = game.hotspotQuestions || [];
    if (!hotspots.length) { alert('אין נקודות מוגדרות במשחק זה! הגדר נקודות בממשק המנהל.'); return; }

    // Build question list: each question references a target hotspot
    var sessionQs = questions.length ? questions.slice() : hotspots.map(function(hs) {
      return { id: 'auto_' + hs.id, prompt: 'לחץ על: ' + hs.label, targetId: hs.id, type: 'click' };
    });
    sessionQs = sessionQs.sort(function() { return Math.random() - 0.5; });
    var s = getGameSettings(game);
    var maxQ = s.questionsPerSession || 10;
    sessionQs = sessionQs.slice(0, Math.min(maxQ, sessionQs.length));

    var state = {
      gameId: game.id, game: game,
      questions: sessionQs, current: 0,
      score: 0, correct: 0,
      studyMode: !!window._studyMode,
      startTime: Date.now(),
      log: []
    };

    mc.innerHTML = '<div class="game-wrapper"><div class="card" id="hs-shell" style="padding:0;overflow:hidden;max-width:900px;margin:0 auto;width:100%"></div></div>';
    showGameExitButton && showGameExitButton();

    var exitBtn = document.getElementById('game-exit-btn');
    if (exitBtn) exitBtn.onclick = function() {
      mc.classList.remove('fullscreen-game');
      hideGameExitButton && hideGameExitButton();
      GAME_REGISTRY.image_hotspot.renderLobby(mc, game);
    };

    function renderHSQuestion() {
      var shell = document.getElementById('hs-shell');
      if (!shell) return;
      if (state.current >= state.questions.length) { endHSGame(); return; }
      var q = state.questions[state.current];
      var targetHs = hotspots.find(function(h) { return h.id === q.targetId; });
      if (!targetHs) { state.current++; renderHSQuestion(); return; }
      var total = state.questions.length;
      var pct = Math.round((state.current / total) * 100);
      var answerTime = state.studyMode ? 999 : (s.answerTime || 30);
      var imgSrc = game.hotspotImage || '';
      var studyBadge = state.studyMode ? '<span style="background:#d1fae5;color:#065f46;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px">מצב לימוד</span>' : '';

      shell.innerHTML =
        '<div style="padding:14px 16px;border-bottom:1px solid #eee">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
            '<span style="font-size:13px;color:#666">שאלה ' + (state.current+1) + '/' + total + studyBadge + '</span>' +
            '<span style="font-size:13px;font-weight:700;color:#4361ee">⭐ ' + state.score + '</span>' +
          '</div>' +
          '<div style="height:5px;background:#eee;border-radius:3px"><div style="width:' + pct + '%;height:100%;background:#4361ee;border-radius:3px;transition:width .3s"></div></div>' +
        '</div>' +
        '<div style="padding:12px 16px 8px">' +
          '<p style="font-size:16px;font-weight:700;color:#1a1a2e;margin:0 0 10px;text-align:center">' + q.prompt + '</p>' +
        '</div>' +
        '<div style="position:relative;cursor:crosshair;user-select:none" id="hs-img-wrap">' +
          (imgSrc ? '<img src="' + imgSrc + '" style="width:100%;display:block;border-radius:0" id="hs-img" draggable="false">' : '<div style="width:100%;height:320px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px">אין תמונה מוגדרת</div>') +
          '<canvas id="hs-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></canvas>' +
          '<div id="hs-feedback-dot" style="display:none;position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>' +
        '</div>' +
        '<div id="hs-result" style="padding:12px 16px;min-height:48px"></div>';

      // Timer
      var timeLeft = answerTime;
      var timerEl = null;
      var answered = false;
      var timerInterval = null;

      if (!state.studyMode) {
        var resultDiv = document.getElementById('hs-result');
        resultDiv.innerHTML = '<div style="text-align:center;font-size:13px;color:#888">⏱️ <span id="hs-timer">' + timeLeft + '</span> שניות</div>';
        timerEl = document.getElementById('hs-timer');
        timerInterval = setInterval(function() {
          timeLeft--;
          if (timerEl) timerEl.textContent = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            if (!answered) handleHSAnswer(null, targetHs, q, state, renderHSQuestion, timerInterval);
          }
        }, 1000);
      }

      // Click handler
      var imgWrap = document.getElementById('hs-img-wrap');
      if (imgWrap) {
        imgWrap.onclick = function(e) {
          if (answered) return;
          var rect = imgWrap.getBoundingClientRect();
          var xPct = ((e.clientX - rect.left) / rect.width) * 100;
          var yPct = ((e.clientY - rect.top) / rect.height) * 100;
          clearInterval(timerInterval);
          handleHSAnswer({ xPct: xPct, yPct: yPct }, targetHs, q, state, renderHSQuestion, timerInterval);
          answered = true;

          // Show click dot
          var dot = document.getElementById('hs-feedback-dot');
          if (dot) {
            dot.style.left = xPct + '%';
            dot.style.top = yPct + '%';
            dot.style.display = 'block';
          }
        };
      }

      // In study mode — show all hotspot markers
      if (state.studyMode && imgSrc) {
        var img = document.getElementById('hs-img');
        if (img) {
          img.onload = function() { drawHotspotMarkers(hotspots, targetHs); };
          if (img.complete) drawHotspotMarkers(hotspots, targetHs);
        }
      }
    }

    function drawHotspotMarkers(allHs, targetHs) {
      var wrap = document.getElementById('hs-img-wrap');
      var canvas = document.getElementById('hs-canvas');
      if (!wrap || !canvas) return;
      canvas.width = wrap.offsetWidth;
      canvas.height = wrap.offsetHeight;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      allHs.forEach(function(hs) {
        var cx = (hs.x / 100) * canvas.width;
        var cy = (hs.y / 100) * canvas.height;
        var isTarget = hs.id === targetHs.id;
        ctx.beginPath();
        ctx.arc(cx, cy, isTarget ? 18 : 10, 0, Math.PI * 2);
        ctx.fillStyle = isTarget ? 'rgba(67,97,238,0.25)' : 'rgba(0,0,0,0.12)';
        ctx.fill();
        ctx.strokeStyle = isTarget ? '#4361ee' : '#888';
        ctx.lineWidth = isTarget ? 2.5 : 1.5;
        ctx.stroke();
        if (state.studyMode) {
          ctx.fillStyle = isTarget ? '#1a1a2e' : '#555';
          ctx.font = (isTarget ? '700 ' : '') + '11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(hs.label, cx, cy + 26);
        }
      });
    }

    function handleHSAnswer(click, targetHs, q, state, nextFn, timerInterval) {
      clearInterval(timerInterval);
      var resultDiv = document.getElementById('hs-result');
      var imgWrap = document.getElementById('hs-img-wrap');
      if (imgWrap) imgWrap.style.cursor = 'default';

      var isCorrect = false;
      var dist = 999;
      if (click) {
        var dx = click.xPct - targetHs.x;
        var dy = click.yPct - targetHs.y;
        dist = Math.sqrt(dx*dx + dy*dy);
        isCorrect = dist <= (targetHs.radius || 8);
      }

      // Show target location
      var canvas = document.getElementById('hs-canvas');
      var wrap = document.getElementById('hs-img-wrap');
      if (canvas && wrap) {
        canvas.width = wrap.offsetWidth;
        canvas.height = wrap.offsetHeight;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        var tx = (targetHs.x / 100) * canvas.width;
        var ty = (targetHs.y / 100) * canvas.height;
        ctx.beginPath();
        ctx.arc(tx, ty, 22, 0, Math.PI * 2);
        ctx.fillStyle = isCorrect ? 'rgba(45,198,83,0.25)' : 'rgba(230,57,70,0.2)';
        ctx.fill();
        ctx.strokeStyle = isCorrect ? '#2dc653' : '#e63946';
        ctx.lineWidth = 3;
        ctx.stroke();
        // crosshair lines
        ctx.strokeStyle = isCorrect ? '#2dc653' : '#e63946';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(tx - 30, ty); ctx.lineTo(tx + 30, ty); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tx, ty - 30); ctx.lineTo(tx, ty + 30); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#1a1a2e';
        ctx.font = '700 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(targetHs.label, tx, ty + 38);
      }

      var points = 0;
      if (isCorrect && !state.studyMode) {
        points = 10;
        state.score += points;
        state.correct++;
      } else if (isCorrect) {
        state.correct++;
      }

      state.log.push({ prompt: q.prompt, ok: isCorrect, targetLabel: targetHs.label });

      var explanation = targetHs.explanation || '';
      if (!click) {
        resultDiv.innerHTML = '<div style="background:#fff8e1;border-radius:8px;padding:10px 14px;text-align:center"><span style="color:#92400e;font-weight:700">⏰ הזמן נגמר! </span><span style="color:#555;font-size:13px">המיקום הנכון מסומן בתמונה</span>' + (explanation ? '<br><span style="font-size:12px;color:#666;margin-top:4px;display:block">' + explanation + '</span>' : '') + '</div>';
      } else if (isCorrect) {
        resultDiv.innerHTML = '<div style="background:#d1fae5;border-radius:8px;padding:10px 14px;text-align:center"><span style="color:#065f46;font-weight:700">✅ נכון! </span>' + (points ? '<span style="color:#059669;font-size:13px">+' + points + ' נקודות</span>' : '') + (explanation ? '<br><span style="font-size:12px;color:#065f46;margin-top:4px;display:block">' + explanation + '</span>' : '') + '</div>';
      } else {
        resultDiv.innerHTML = '<div style="background:#fee2e2;border-radius:8px;padding:10px 14px;text-align:center"><span style="color:#991b1b;font-weight:700">❌ לא מדויק. </span><span style="color:#555;font-size:13px">המיקום הנכון מסומן</span>' + (explanation ? '<br><span style="font-size:12px;color:#7f1d1d;margin-top:4px;display:block">' + explanation + '</span>' : '') + '</div>';
      }

      setTimeout(function() {
        state.current++;
        nextFn();
      }, state.studyMode ? 2200 : 1600);
    }

    function endHSGame() {
      mc.classList.remove('fullscreen-game');
      hideGameExitButton && hideGameExitButton();
      var shell = document.getElementById('hs-shell');
      if (!shell) return;
      var total = state.questions.length;
      var correct = state.correct;
      var acc = total ? Math.round((correct / total) * 100) : 0;
      var level = 'מתחיל', lc = 'badge-warning';
      if (acc >= 85) { level = 'מומחה'; lc = 'badge-success'; }
      else if (acc >= 65) { level = 'מתקדם'; lc = 'badge-info'; }
      var r = {
        id: 'r' + Date.now(), userId: currentUser.username, userName: currentUser.name,
        score: state.score, correct: correct, total: total, accuracy: acc, level: level,
        date: new Date().toISOString(), gameType: game.id, answerSpeeds: '', avgAnswerTime: '',

    var elapsed = Math.round((Date.now() - (safetyState.startTimes[q.id] || Date.now())) / 1000);
    if (!safetyState.timers) safetyState.timers = {};
    safetyState.timers[q.id] = elapsed;

    var s = getGameSettings(game);
    document.querySelectorAll('#sagrid button').forEach(function (b) { b.disabled = true; });
    if (game.answerMode === 'binary') {
      var yesBtn = document.getElementById('sbtn-yes'), noBtn = document.getElementById('sbtn-no');
      var opts = (game.answerConfig && game.answerConfig.options) || [];
      if (ok) {
        var pts = s.pointsPerCorrect;
        if (s.bonusForSpeed && elapsed < s.answerTime * 0.35) pts = Math.round(pts * 1.5);
        safetyState.score += pts; safetyState.correct++;
        opts.forEach(function (opt, i) {
          var btn = i === 0 ? yesBtn : noBtn;
          if (opt.value === answer && btn) btn.style.cssText += 'border-width:3px;box-shadow:0 0 0 3px #2dc65340';
        });
      } else {
        if (answer && yesBtn) yesBtn.style.cssText += 'opacity:0.4';

  window.submitGameWizard = function () {
    if ((DB.games || []).length >= MAX_GAMES) { alert('מקסימום ' + MAX_GAMES + ' משחקים'); return; }
    var name = document.getElementById('gw-name').value.trim();
    var icon = document.getElementById('gw-icon').value.trim() || '🎯';
    var templateId = document.getElementById('gw-template').value;
    var n = parseInt(document.getElementById('gw-optcount').value, 10) || 2;
    var targetTopicId = (document.getElementById('gw-topic')||{}).value || '';
    if (!name) { alert('הזן שם משחק'); return; }
    if (templateId === 'video') { alert('סוג זה עדיין לא זמין'); return; }
    var labels = [0, 1, 2, 3, 4, 5].slice(0, n).map(function (i) {
      var el = document.getElementById('gw-opt' + i);
      return (el && el.value.trim()) || ('תשובה ' + (i + 1));
    });
    var id = 'custom_' + Date.now();
    var mode = n === 2 ? 'binary' : 'multiple_choice';
    var descEl = document.getElementById('gw-desc');
    var desc = descEl && descEl.value.trim();
    var game = {
      id: id, templateId: templateId, name: name, icon: icon, hidden: false,
      order: DB.games.length, builtin: false, answerMode: mode,
      settings: cloneSettings(null, templateId),
      description: desc || defaultGameDescription({ id: id, templateId: templateId, answerMode: mode }),
      meta: { progressLabel: templateId === 'text_quiz' ? 'שאלה' : 'שאלה', filters: templateId === 'text_quiz' ? [] : ['cat'] }
    };
    if (mode === 'binary') {
      game.answerConfig = {
        optionCount: 2,
        prompt: (document.getElementById('gw-prompt') && document.getElementById('gw-prompt').value.trim()) || '?',
        options: [
          { value: labels[0], label: labels[0], icon: '✅', tone: 'success' },
          { value: labels[1], label: labels[1], icon: '❌', tone: 'danger' }
        ]
      };
      if (templateId === 'image_timed') game.meta.filters = [];
    } else {
      game.answerConfig = { optionCount: n, shuffle: true, perQuestionPrompt: true, options: labels.map(function (l) { return { value: l, label: l }; }) };
    }
    DB.games.push(game);
    DB.questionsByGame[id] = [];
    DB.resultsByGame[id] = [];

    // Add to target topic's gameIds
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    if (targetTopicId) {
      var targetTopic = topics.find(function(t){ return t.id === targetTopicId; });
      if (targetTopic) {
        if (!targetTopic.gameIds) targetTopic.gameIds = [];
        targetTopic.gameIds.push(id);
        DB.topics = topics;
      }
    }
    // If no topic chosen — create a standalone topic for it (or add to a "general" bucket)
    // We create a minimal topic so it appears in the lobby
    else {
      var generalTopic = topics.find(function(t){ return t.id === 'general_games'; });
      if (!generalTopic) {
        generalTopic = { id: 'general_games', name: 'כללי', icon: '🎮', color: '#6366f1', description: 'משחקים נוספים', gameIds: [] };
        topics.push(generalTopic);
      }
      generalTopic.gameIds.push(id);
      DB.topics = topics;
    }

    syncLegacyFromGames();
    saveDB();
    closeModal();
    initApp();
    showTab('questions');
    renderQuestions(document.getElementById('mc'), id);
  };

  window.openMoveGameToTopic = function(gameId) {
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    var gameObj = typeof getGame === 'function' ? getGame(gameId) : null;
    if (!gameObj) return;
    var currentTopic = topics.find(function(t){ return (t.gameIds||[]).indexOf(gameId) >= 0; });
    var topicOptions = '<option value="">ללא תיקייה (כללי)</option>' +
      topics.map(function(t){

    );

  window.submitMoveGameToTopic = function(gameId) {
    var newTopicId = (document.getElementById('move-topic-select')||{}).value || '';
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    // Remove from all topics
    topics.forEach(function(t){ t.gameIds = (t.gameIds||[]).filter(function(id){ return id !== gameId; }); });
    // Add to new topic if selected
    if (newTopicId) {
      var target = topics.find(function(t){ return t.id === newTopicId; });
      if (target) { if (!target.gameIds) target.gameIds=[]; target.gameIds.push(gameId); }
    } else {
      var gen = topics.find(function(t){ return t.id==='general_games'; });
      if (!gen) { gen={id:'general_games',name:'כללי',icon:'🎮',color:'#6366f1',description:'משחקים נוספים',gameIds:[]}; topics.push(gen); }
      gen.gameIds.push(gameId);
    }
    DB.topics = topics;
    saveDB();
    closeModal();
    renderConfig(document.getElementById('mc'), 'general');
  };

  // Delete a game entirely
  window.confirmDeleteGame = function(gameId) {
    var gameObj = typeof getGame === 'function' ? getGame(gameId) : null;
    var name = gameObj ? (gameObj.icon + ' ' + gameObj.name) : gameId;

      '</div>'
    );
  };

  window.executeDeleteGame = function(gameId) {
    // Remove from DB.games
    DB.games = (DB.games||[]).filter(function(g){ return g.id !== gameId; });
    // Remove from topics
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    topics.forEach(function(t){ t.gameIds = (t.gameIds||[]).filter(function(id){ return id !== gameId; }); });
    DB.topics = topics.filter(function(t){ return (t.gameIds||[]).length > 0 || t._keepEmpty; });
    // Remove questions and results
    if (DB.questionsByGame) delete DB.questionsByGame[gameId];
    if (DB.resultsByGame) delete DB.resultsByGame[gameId];
    // Legacy cleanup
    if (DB.gameOrder) DB.gameOrder = DB.gameOrder.filter(function(id){ return id !== gameId; });
    if (DB.gameNames) delete DB.gameNames[gameId];
    if (DB.gameHidden) delete DB.gameHidden[gameId];
    if (typeof syncLegacyFromGames === 'function') syncLegacyFromGames();
    saveDB();
    closeModal();
    initApp();
    renderConfig(document.getElementById('mc'), 'general');
  };

  // Delete a topic (and optionally its games)
  window.confirmDeleteTopic = function(topicId) {
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    var topic = topics.find(function(t){ return t.id === topicId; });
    if (!topic) return;
    var gameCount = (topic.gameIds||[]).length;
    showModal('🗑 מחיקת תיקייה',
      '<p style="margin-bottom:12px;color:#555">בטוח שרוצה למחוק את התיקייה <b>' + topic.icon + ' ' + topic.name + '</b>?</p>' +
      (gameCount > 0 ? '<p style="font-size:13px;color:#555;margin-bottom:16px">יש בה ' + gameCount + ' משחקים. מה לעשות איתם?</p>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          '<button onclick="executeDeleteTopic(\'' + topicId + '\',false)" style="padding:10px;background:#fff3cd;border:1.5px solid #f59e0b;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">מחק תיקייה בלבד — העבר משחקים ל"כללי"</button>' +
          '<button onclick="executeDeleteTopic(\'' + topicId + '\',true)" style="padding:10px;background:#fde8e8;border:1.5px solid #e63946;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">מחק תיקייה + כל המשחקים שלה</button>' +
          '<button onclick="closeModal()" style="padding:10px;background:#f0f2f5;border:none;border-radius:8px;cursor:pointer;font-size:13px">ביטול</button>' +
        '</div>' :
        '<div style="display:flex;gap:10px"><button class="btn-danger w100" onclick="executeDeleteTopic(\'' + topicId + '\',false)" style="padding:11px">מחק</button><button onclick="closeModal()" style="padding:11px;flex:1;background:#f0f2f5;border:none;border-radius:8px;cursor:pointer">ביטול</button></div>'
      )
    );
  };

  window.executeDeleteTopic = function(topicId, deleteGames) {
    var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    var topic = topics.find(function(t){ return t.id === topicId; });
    if (deleteGames && topic) {
      // Delete all games in this topic
      (topic.gameIds||[]).forEach(function(gid){
        DB.games = (DB.games||[]).filter(function(g){ return g.id !== gid; });
        if (DB.questionsByGame) delete DB.questionsByGame[gid];
        if (DB.resultsByGame) delete DB.resultsByGame[gid];
        if (DB.gameOrder) DB.gameOrder = DB.gameOrder.filter(function(id){ return id !== gid; });
        if (DB.gameNames) delete DB.gameNames[gid];
        if (DB.gameHidden) delete DB.gameHidden[gid];
      });
    } else if (topic) {
      // Move games to "כללי"
      var gen = topics.find(function(t){ return t.id === 'general_games' && t.id !== topicId; });
      if (!gen) { gen={id:'general_games',name:'כללי',icon:'🎮',color:'#6366f1',description:'משחקים נוספים',gameIds:[]}; topics.push(gen); }
      (topic.gameIds||[]).forEach(function(gid){ gen.gameIds.push(gid); });
    }
    DB.topics = topics.filter(function(t){ return t.id !== topicId; });
    if (typeof syncLegacyFromGames === 'function') syncLegacyFromGames();
    saveDB();
    closeModal();
    initApp();
    renderConfig(document.getElementById('mc'), 'general');
  };
})();

function getPlayerProgress(gameId) {
  var res = typeof getGameResults==='function' ? getGameResults(gameId) : [];
  var mine = res.filter(function(r){ return r.userId === currentUser.username; });
  if (!mine.length) return null;
  var last = mine[0];
  return { accuracy: last.accuracy, level: last.level, plays: mine.length, score: Math.max.apply(null, mine.map(function(r){return r.score;})) };
}

function getTotalPlayerStats() {
  var games = typeof getAllGames==='function' ? getAllGames() : [];
  var totalPlays = 0, totalAcc = 0, accCount = 0, totalScore = 0;
  games.forEach(function(g) {
    var p = getPlayerProgress(g.id);
    if (p) { totalPlays += p.plays; totalAcc += p.accuracy * p.plays; accCount += p.plays; if(p.score > totalScore) totalScore = p.score; }
  });
  return { plays: totalPlays, avgAcc: accCount ? Math.round(totalAcc/accCount) : 0, bestScore: totalScore };
}

window.getTopics = function() {
  // Initialize DB.topics from defaults if missing
  if (!DB.topics || !DB.topics.length) {
    DB.topics = DEFAULT_TOPIC_DEFS.map(function(d){ return Object.assign({}, d, {gameIds: d.gameIds.slice()}); });
  }

  // Ensure every game in DB.games appears in exactly one topic
  var allGameIds = (DB.games || []).map(function(g){ return g.id; });
  allGameIds.forEach(function(gid) {
    var inTopic = DB.topics.some(function(t){ return (t.gameIds||[]).indexOf(gid) >= 0; });
    if (!inTopic) {
      // Try to find a default topic that lists this game
      var defTopic = DEFAULT_TOPIC_DEFS.find(function(d){ return d.gameIds.indexOf(gid) >= 0; });
      if (defTopic) {
        var existing = DB.topics.find(function(t){ return t.id === defTopic.id; });
        if (existing) { existing.gameIds.push(gid); }
        else { DB.topics.push(Object.assign({}, defTopic, {gameIds: [gid]})); }
      } else {
        // Orphan game → put in "כללי" bucket
        var gen = DB.topics.find(function(t){ return t.id === 'general_games'; });
        if (!gen) {
          gen = {id:'general_games', name:'כללי', icon:'🎮', color:'#6366f1', description:'משחקים נוספים', gameIds:[]};
          DB.topics.push(gen);
        }
        gen.gameIds.push(gid);
      }
    }
  });

  // Remove gameIds that no longer exist in DB.games
  DB.topics.forEach(function(t){
    t.gameIds = (t.gameIds||[]).filter(function(gid){ return allGameIds.indexOf(gid) >= 0; });
  });

  // Remove topics with no games (except if manually created)
  DB.topics = DB.topics.filter(function(t){ return (t.gameIds||[]).length > 0 || t._keepEmpty; });

  return DB.topics;
};
