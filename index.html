<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>פלטפורמת ידע מקצועי — נהגים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:var(--color-background-tertiary,#f0f2f5);color:var(--color-text-primary,#1a1a2e);-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
:root{--primary:#4361ee;--success:#2dc653;--danger:#e63946;--radius:12px}
/* ── Platform Upgrade CSS ── */
.platform-lobby{padding:16px 0}
.pl-header{text-align:center;padding:20px 16px 14px}
.pl-header h1{font-size:22px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.pl-header p{color:#666;font-size:13px}
.pl-stats-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.pl-stat-pill{background:#f0f4ff;border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;color:#4361ee}
.pl-games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:0 4px}
.game-card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:20px;cursor:pointer;transition:all .18s;border:2px solid transparent;position:relative;overflow:hidden}
.game-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.game-card.completed{border-color:#2dc65320}
.game-card-accent{position:absolute;top:0;left:0;right:0;height:4px;border-radius:14px 14px 0 0}
.game-card-icon{font-size:36px;margin-bottom:10px;line-height:1}
.game-card-name{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.game-card-desc{font-size:12px;color:#888;margin-bottom:12px;line-height:1.5}
.game-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.game-card-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
.gc-progress{margin-top:8px}
.gc-progress-row{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px}
.gc-progress-bar{height:5px;background:#eee;border-radius:3px;overflow:hidden}
.gc-progress-fill{height:100%;border-radius:3px;transition:width .5s}
.game-card-btn{width:100%;margin-top:12px;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;transition:opacity .15s}
.game-card-btn:hover{opacity:.88}
.mode-selector{display:flex;gap:10px;margin-bottom:20px;background:#f0f4ff;border-radius:12px;padding:4px}
.mode-btn{flex:1;padding:9px 12px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#666;transition:all .15s}
.mode-btn.active{background:#fff;color:#4361ee;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.explanation-box{background:#f0fff4;border-right:4px solid #2dc653;border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.6;color:#155724;display:none}
.explanation-box.visible{display:block}
.explanation-box.wrong-exp{background:#fff8e1;border-color:#f59e0b;color:#78350f}
/* Explanation floating bubble */
.exp-bubble-overlay{position:fixed;inset:0;z-index:20000;display:flex;align-items:flex-end;justify-content:center;padding:0 12px 24px;pointer-events:none}
.exp-bubble{background:#fff;border-radius:16px 16px 16px 4px;box-shadow:0 8px 40px rgba(0,0,0,.22);padding:16px 18px;max-width:480px;width:100%;font-size:14px;line-height:1.6;color:#1a1a2e;pointer-events:all;animation:expBubbleIn .25s cubic-bezier(.34,1.56,.64,1)}
.exp-bubble.correct-bub{border-top:4px solid #2dc653}
.exp-bubble.wrong-bub{border-top:4px solid #f59e0b}
.exp-bubble-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exp-bubble-icon{font-size:20px;line-height:1}
.exp-bubble-title{font-size:13px;font-weight:700;color:#555}
.exp-bubble-close{margin-right:auto;font-size:18px;cursor:pointer;color:#aaa;background:none;border:none;padding:0 4px;line-height:1}
.exp-bubble-text{font-size:14px;color:#333;line-height:1.6}
@keyframes expBubbleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.study-mode-badge{display:inline-block;background:#e0f7fa;color:#006064;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px;vertical-align:middle}
.game-card-new-badge{position:absolute;top:10px;right:10px;background:#4361ee;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
.pl-section-title{font-size:13px;font-weight:700;color:#888;letter-spacing:.05em;text-transform:uppercase;padding:0 4px;margin-bottom:10px}

/* ── Topic Folders ── */
.topic-folder{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.07);padding:22px 20px 18px;cursor:pointer;transition:all .18s;border:2px solid transparent;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start}
.topic-folder:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.13)}
.topic-folder-accent{position:absolute;top:0;left:0;right:0;height:5px;border-radius:16px 16px 0 0}
.topic-folder-icon{font-size:38px;margin-bottom:10px;line-height:1}
.topic-folder-name{font-size:17px;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.topic-folder-desc{font-size:12px;color:#888;margin-bottom:12px;line-height:1.5;flex:1}
.topic-folder-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.topic-folder-count{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}
.topic-folder-arrow{margin-right:auto;font-size:18px;color:#bbb;transition:transform .15s}
.topic-folder:hover .topic-folder-arrow{transform:translateX(-4px);color:#4361ee}
.topic-folder-new{position:absolute;top:11px;right:11px;background:#4361ee;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
/* ── Topic Inner Screen ── */
.topic-inner-header{display:flex;align-items:center;gap:12px;padding:16px 4px 18px}
.topic-inner-back{padding:7px 14px;border:1.5px solid #e0e0e0;background:#fff;color:#555;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;flex-shrink:0}
.topic-inner-back:hover{background:#f0f2f5}
.topic-inner-title{font-size:20px;font-weight:800;color:#1a1a2e}
.topic-inner-subtitle{font-size:12px;color:#888;margin-top:2px}
.topic-games-list{display:flex;flex-direction:column;gap:12px}
.tg-card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:18px 20px;cursor:pointer;transition:all .16s;border:2px solid transparent;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.tg-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);border-color:#e0e8ff}
.tg-card-accent{position:absolute;top:0;bottom:0;right:0;width:5px;border-radius:0 14px 14px 0}
.tg-card-icon{font-size:32px;flex-shrink:0}
.tg-card-body{flex:1;min-width:0}
.tg-card-name{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:3px}
.tg-card-desc{font-size:12px;color:#888;line-height:1.5;margin-bottom:8px}
.tg-card-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tg-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px}
.tg-progress{margin-top:8px}
.tg-progress-row{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:3px}
.tg-progress-bar{height:4px;background:#eee;border-radius:2px;overflow:hidden}
.tg-progress-fill{height:100%;border-radius:2px;transition:width .5s}
.tg-card-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.tg-btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;border:none;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.tg-btn:hover{opacity:.88}
.tg-edit-btn{padding:7px 10px;border:1.5px solid #e0e0e0;background:#fff;border-radius:8px;font-size:13px;cursor:pointer;color:#888}

.hidden{display:none!important}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;transition:all .15s;padding:10px 20px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost:hover{background:#eff2ff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
button:active:not(:disabled){transform:scale(0.97)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fff;color:#1a1a2e}
input:focus,select:focus{border-color:var(--primary)}
label{font-size:13px;font-weight:600;color:#555;display:block;margin-bottom:4px}
.form-group{margin-bottom:16px}
input[type=range]{border:none;padding:4px 0;accent-color:var(--primary)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:#d4f5e2;color:#16803a}
.badge-warning{background:#fff3cd;color:#856404}
.badge-danger{background:#fde8e8;color:#c0392b}
.badge-info{background:#dbeafe;color:#1d4ed8}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.08);padding:24px}
#app{min-height:100vh;flex-direction:column}
.topbar{background:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.topbar-brand{font-size:15px;font-weight:700;color:var(--primary);cursor:pointer;padding:2px 4px;border-radius:8px;transition:background .15s;display:flex;align-items:center;background:transparent}
.topbar-brand:hover{background:#f5f5f5}
.flex{display:flex}.center{align-items:center;justify-content:center}
.gap2{gap:16px}.gap3{gap:24px}.w100{width:100%}
.mt2{margin-top:16px}.mt3{margin-top:24px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.nav-tabs{display:flex;gap:4px;background:#f0f2f5;padding:3px;border-radius:10px}
.nav-tab{padding:6px 14px;border:none;background:transparent;border-radius:8px;font-size:13px;cursor:pointer;color:#555;font-weight:600}
.nav-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.mc{flex:1;padding:12px 20px;max-width:1100px;margin:0 auto;width:100%;min-height:0}.mc.fullscreen-game{max-width:100%;padding:12px 16px}
.game-wrapper{max-width:900px;margin:0 auto;min-height:0;display:flex;flex-direction:column}
.game-header{text-align:center;margin-bottom:16px}
.game-header h2{font-size:22px;font-weight:700}
.game-header p{color:#555;font-size:13px;margin-top:4px}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.progress-label{font-size:12px;color:#555;white-space:nowrap}
.progress-bar{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.image-stage{border-radius:var(--radius);overflow:hidden;background:#fff;min-height:0;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative}
.image-stage img{max-width:100%;max-height:420px;object-fit:contain;object-position:center;display:block;width:100%;opacity:1!important;filter:brightness(1.08) contrast(1.02);image-rendering:auto;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.stage-overlay{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;background:none;padding:18px 0 12px;pointer-events:none}
.fullscreen-game{position:fixed;inset:0;z-index:9999;background:#f0f2f5;overflow-y:auto;padding:16px;padding-top:12px}
.fullscreen-game .game-wrapper{max-width:900px;margin:0 auto}
.fullscreen-game .image-stage{min-height:calc(100vh - 300px);max-height:calc(100vh - 260px)}
.fullscreen-game .image-stage img{max-height:calc(100vh - 260px)}
.big-num{font-size:72px;font-weight:700;line-height:1}
.stage-label{font-size:15px;opacity:.9}
.question-text{font-size:18px;font-weight:700;text-align:center;margin-bottom:14px;color:#1a1a2e}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.answer-btn{padding:14px;border:2px solid #e0e0e0;background:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;color:#1a1a2e}
.answer-btn:hover:not(:disabled){border-color:var(--primary);background:#eff2ff;color:var(--primary)}
.answer-btn.correct{border-color:var(--success);background:#d4f5e2;color:#16803a}
.answer-btn.wrong{border-color:var(--danger);background:#fde8e8;color:#c0392b}
.answer-btn:disabled{cursor:not-allowed}
.timer-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.timer-display{font-size:36px;font-weight:700;color:var(--primary);min-width:56px;text-align:center}
.timer-display.urgent{color:var(--danger)}
.timer-track{flex:1;height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;max-width:260px}
.timer-fill{height:100%;background:var(--primary);border-radius:4px;transition:width 1s linear}
.timer-fill.urgent{background:var(--danger)}
.results-card{text-align:center;padding:32px}
.result-score{font-size:72px;font-weight:700;color:var(--primary);line-height:1}
.result-label{font-size:15px;color:#555;margin-top:8px;margin-bottom:14px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-box{background:#f7f9ff;border-radius:10px;padding:14px}
.stat-val{font-size:24px;font-weight:700;color:var(--primary)}
.stat-lbl{font-size:11px;color:#555;margin-top:4px}
.level-badge{display:inline-block;padding:8px 28px;border-radius:20px;font-size:18px;font-weight:700;margin-bottom:24px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.stat-card .num{font-size:32px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:#555;margin-top:4px}
.table-wrap{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.table-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0}
.table-head h3{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;color:#555;padding:9px 14px;text-align:right;background:#f9f9f9;border-bottom:1px solid #f0f0f0}
td{font-size:13px;padding:10px 14px;border-bottom:1px solid #f9f9f9;color:#1a1a2e}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.q-img{width:88px;height:58px;border-radius:6px;object-fit:cover;background:#eee;cursor:zoom-in;transition:transform .15s;display:block}.q-img:hover{transform:scale(1.06);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.settings-group h3{font-size:15px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--primary)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1}
.range-val{font-size:15px;font-weight:700;color:var(--primary);min-width:36px;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border-radius:var(--radius);padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{background:transparent;border:none;font-size:20px;cursor:pointer;color:#555;padding:4px 8px}
#admin-btn{position:fixed;bottom:12px;left:12px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.12);border:none;cursor:pointer;font-size:14px;z-index:998;opacity:.3;transition:opacity .2s}
#admin-btn:hover{opacity:1}
.name-box{background:#f7f9ff;border-radius:10px;padding:20px;margin-bottom:20px;text-align:center}
.name-box h3{font-size:16px;font-weight:700;margin-bottom:12px;color:#1a1a2e}
.name-box input{max-width:280px;margin:0 auto;display:block;text-align:center;font-size:16px;padding:12px}




@media(max-width:768px){
  html,body{margin:0!important;padding:0!important}
  #app{padding:0!important;margin:0!important}
  .mc{padding:0!important;margin:0!important}
  .game-wrapper{padding:0!important;margin:0!important}

  .game-header{margin:4px 8px 3px 8px!important;padding:0!important}
  .progress-row{margin:0 8px 4px 8px!important;padding:0!important}

  /* מרכוז אנכי של תוכן המשחק במסך מלא */
  .fullscreen-game{
    display:flex!important;
    flex-direction:column!important;
    justify-content:center!important;
    min-height:100vh;
    min-height:100dvh;
    padding-top:8px!important;
    padding-bottom:8px!important;
  }
  .fullscreen-game .game-wrapper{
    flex:0 0 auto;
    width:100%;
  }

  /* התמונה — contain כמו lightbox (משחק = תצוגה מקדימה) */
  .fullscreen-game .image-stage,
  .image-stage,
  .safety-preview-overlay .sp-image-stage,
  .fullscreen-game.safety-preview-run .image-stage,
  #sp-image-stage{
    width:100%!important;
    max-height:calc(100vh - 310px)!important;
    min-height:200px!important;
    height:auto!important;
    margin:0 0 6px 0!important;
    border-radius:0!important;
    overflow:hidden!important;
    background:#111!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    position:relative!important;
  }
  .fullscreen-game .image-stage img,
  .image-stage img,
  .safety-preview-overlay .sp-image-stage img,
  .fullscreen-game.safety-preview-run .image-stage img,
  #sp-preview-img,
  #sgimg{
    width:auto!important;
    height:auto!important;
    max-width:100%!important;
    max-height:calc(100vh - 310px)!important;
    object-fit:contain!important;
    display:block!important;
    filter:brightness(1.08) contrast(1.02)!important;
    -webkit-backface-visibility:hidden!important;
    backface-visibility:hidden!important;
  }

  /* פריסת fullscreen — תצוגה מקדימה זהה למשחק */
  .fullscreen-game #sgp,
  .fullscreen-game.safety-preview-run #sgp{
    padding:0!important;
    margin:0!important;
    max-width:100%!important;
    width:100%!important;
    box-shadow:none!important;
    border:none!important;
    border-radius:0!important;
  }
  .fullscreen-game.safety-preview-run{
    padding:16px!important;
    padding-top:12px!important;
  }
  .fullscreen-game.safety-preview-run .game-wrapper{
    max-width:none!important;
    margin:0!important;
    padding:0!important;
  }
  .safety-preview-overlay .sp-body{
    max-width:100%!important;
    width:100%!important;
  }

  .question-text{font-size:16px!important;margin:0 8px 6px 8px!important;font-weight:700!important}
  .answer-grid{gap:8px!important;margin:0 8px 6px 8px!important}
  .answer-btn{padding:14px!important;font-size:15px!important;font-weight:700!important}
  .timer-row{margin:0 8px 4px 8px!important}
}

.app-loader{position:fixed;inset:0;z-index:100000;background:var(--primary);display:flex;align-items:center;justify-content:center;transition:opacity .3s ease}
.app-loader.fade-out{opacity:0;pointer-events:none}
.app-loader-inner{text-align:center;color:#fff;padding:24px}
.app-loader-spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 20px;animation:appLoaderSpin .8s linear infinite}
@keyframes appLoaderSpin{to{transform:rotate(360deg)}}
.app-loader-text{font-size:15px;opacity:.9}
.eq-preview-frame{height:200px;overflow:hidden;border-radius:8px;border:2px solid #e0e0e0;background:#111;position:relative;touch-action:none;cursor:grab;user-select:none}
.eq-preview-frame.eq-dragging{cursor:grabbing}
.eq-preview-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.eq-pos-readout{font-size:12px;color:#555;margin-top:8px;text-align:center}
.safety-preview-overlay{position:fixed;inset:0;z-index:10001;background:#f0f2f5;overflow-y:auto;display:flex;flex-direction:column}
.safety-preview-overlay.hidden{display:none!important}
.safety-preview-overlay .sp-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.safety-preview-overlay .sp-body{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto}
.safety-preview-overlay .sp-question-label{font-size:17px;font-weight:800;text-align:center;padding:10px 12px 6px;color:#1a1a2e}
.safety-preview-overlay .sp-goto-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px 10px}
.safety-preview-overlay .sp-goto-row input{width:72px;padding:8px 10px;text-align:center;font-size:14px;font-weight:700}
.safety-preview-overlay .sp-goto-row button{padding:8px 14px;font-size:13px;background:#fff;border:1.5px solid var(--primary);color:var(--primary);border-radius:8px;cursor:pointer;font-weight:600}
.safety-preview-overlay .sp-progress-row{display:flex;align-items:center;gap:10px;padding:4px 12px 4px}
.safety-preview-overlay .sp-nav-row{display:flex;justify-content:center;align-items:center;gap:14px;padding:10px 12px 16px}
.safety-preview-overlay .sp-nav-row button{padding:10px 20px;font-size:14px;background:#fff;border:1.5px solid #e0e0e0;border-radius:8px;cursor:pointer;font-weight:600}
.safety-preview-overlay .sp-nav-row button:disabled{opacity:.35;cursor:not-allowed}
.safety-preview-overlay .sp-image-stage{width:100%;overflow:hidden;background:#111;margin-bottom:8px;position:relative}
.safety-preview-overlay .sp-image-stage img{width:100%;height:100%;object-fit:cover;display:block}
.sp-img-edit-fab{position:absolute;top:8px;left:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.safety-preview-overlay .sp-image-stage.sp-editing .sp-img-edit-fab{display:none}
.safety-preview-overlay .sp-image-stage.sp-editing{cursor:grab;touch-action:none;user-select:none}
.safety-preview-overlay .sp-image-stage.sp-editing.sp-dragging{cursor:grabbing}
.sp-img-edit-panel{position:absolute;bottom:0;left:0;right:0;z-index:4;background:rgba(0,0,0,.78);color:#fff;padding:10px 12px 12px}
.sp-img-edit-panel.hidden{display:none}
.sp-img-edit-readout{font-size:12px;text-align:center;margin-bottom:8px;font-weight:600;letter-spacing:.02em}
.sp-img-edit-actions{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.sp-zoom-btn{min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;font-weight:700;line-height:1}
.sp-img-save{padding:8px 14px;border:none;border-radius:8px;background:#f59e0b;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.sp-img-cancel{padding:8px 12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;background:transparent;color:#fff;cursor:pointer;font-size:14px}
.safety-preview-overlay .sp-edit-btn{position:absolute;top:10px;left:10px;z-index:2;padding:8px 14px;font-size:14px;background:rgba(255,255,255,.92);border:1.5px solid #e0e0e0;border-radius:8px;cursor:pointer;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.safety-preview-overlay .sp-question-text{font-size:18px;font-weight:700;text-align:center;margin:0 12px 10px;color:#1a1a2e}
.safety-preview-overlay .sp-answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px;max-width:400px;margin:0 auto;width:100%}
.sp-preview-exit{position:fixed;top:10px;left:10px;z-index:10002;padding:8px 16px;background:#fff;border:1.5px solid #e0e0e0;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.15);color:#333;display:flex;align-items:center;gap:6px}
.sp-preview-exit::before{content:'←'}
.fullscreen-game.safety-preview-run .game-wrapper{max-width:900px;margin:0 auto}
@media(min-width:769px){
  .fullscreen-game.safety-preview-run .card#sgp{box-shadow:none!important;border:none!important}
}
.safety-preview-overlay .sp-feedback{text-align:center;font-size:15px;font-weight:700;padding:8px 12px 0;min-height:28px}
.safety-admin-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:8px;background:#ede9fe;border:1.5px solid #7c3aed;border-radius:10px}
.safety-admin-label{font-size:13px;font-weight:700;color:#5b21b6}
.safety-admin-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.safety-admin-actions button{padding:6px 12px;font-size:12px;background:#fff;border:1.5px solid #7c3aed;color:#5b21b6;border-radius:8px;cursor:pointer;font-weight:600}
.safety-admin-actions button:disabled{opacity:.35;cursor:not-allowed}
.safety-admin-actions button.sadm-exit{border-color:#e63946;color:#c0392b}
#sstage .sp-img-edit-fab{position:absolute;top:8px;left:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
#sstage.sp-editing .sp-img-edit-fab{display:none}
#sstage.sp-editing{cursor:grab;touch-action:none;user-select:none}
#sstage.sp-editing.sp-dragging{cursor:grabbing}
</style>
</head>

// ── טעינת הגדרות בטיחות מ-Google Sheets ────────────────────
var _settingsCache = null;
var _settingsCacheTime = 0;
var _settingsCacheTTL = 5 * 60 * 1000; // 5 דקות

function loadSafetySettingsFromSheets(callback) {
  var now = Date.now();
  // השתמש ב-cache אם עדיין תקף
  if (_settingsCache && (now - _settingsCacheTime) < _settingsCacheTTL) {
    if (callback) callback(_settingsCache);
    return;
  }
  // טען מ-Sheets
  var url = SHEET_URL + '?action=getSettings&t=' + now;
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data.ok || !data.settings) return;
      var s = data.settings;
      // המר ערכים לסוג הנכון (Sheets מחזיר 0/1 עבור false/true)
      function toBool(v){ return v === true || v === 1 || v === '1' || v === 'true'; }
      function toNum(v,def){ var n=Number(v); return isNaN(n)?def:n; }
      // חפוף על DB.safetySettings
      if ('imageDisplayTime'   in s) DB.safetySettings.imageDisplayTime   = toNum(s.imageDisplayTime, DB.safetySettings.imageDisplayTime);
      if ('answerTime'         in s) DB.safetySettings.answerTime         = toNum(s.answerTime, DB.safetySettings.answerTime);
      if ('questionsPerSession' in s) DB.safetySettings.questionsPerSession = toNum(s.questionsPerSession, DB.safetySettings.questionsPerSession);
      if ('pointsPerCorrect'   in s) DB.safetySettings.pointsPerCorrect   = toNum(s.pointsPerCorrect, DB.safetySettings.pointsPerCorrect);
      if ('bonusForSpeed'      in s) DB.safetySettings.bonusForSpeed      = toBool(s.bonusForSpeed);
      if ('showCountdown'      in s) DB.safetySettings.showCountdown      = toBool(s.showCountdown);
      if ('showCountdown' in s) DB.settings.showCountdown = toBool(s.showCountdown);
      if ('showAnswerWithImage' in s) DB.safetySettings.showAnswerWithImage = toBool(s.showAnswerWithImage);
      if ('requireName'        in s) DB.safetySettings.requireName        = toBool(s.requireName);
      if ('filterLocation'     in s) DB.safetySettings.filterLocation     = s.filterLocation;
      if ('filterDiff'         in s) DB.safetySettings.filterDiff         = s.filterDiff;
      _settingsCache = s;
      _settingsCacheTime = now;
      if (callback) callback(s);
    })
    .catch(function(){
      // אם Sheets לא נגיש — ממשיך עם ברירות המחדל המוטמעות
      if (callback) callback(null);
    });
}

const DB_VERSION = '3.16';
const SCHEMA_VERSION = '7'; // עודכן: topics מסונכרנים עם games, אין builtin-lock
function loadStoredDB() {
  // נסה localStorage
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('igDB')||'null'); } catch(e) {}
  if(!saved) { try { saved = JSON.parse(sessionStorage.getItem('igDB')||'null'); } catch(e) {} }

  // בדיקת schema
  if(saved) {
    const savedSchema = (saved._version||'').split('.')[0];
    if(savedSchema !== SCHEMA_VERSION) {
      try{localStorage.removeItem('igDB');}catch(e){}
      try{sessionStorage.removeItem('igDB');}catch(e){}
      saved = null;
    }
  }

  if(saved) return saved;

  // נסה IndexedDB (אסינכרוני — נעלה לאחר כן)
  try{
    const req=indexedDB.open('igDB',1);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore('kv');};
    req.onsuccess=e=>{
      const tx=e.target.result.transaction('kv','readonly');
      const getReq=tx.objectStore('kv').get('igDB');
      getReq.onsuccess=()=>{
        if(getReq.result){
          try{
            const parsed=JSON.parse(getReq.result);
            const schema=(parsed._version||'').split('.')[0];
            if(schema===SCHEMA_VERSION){
              // מזג לתוך DB הנוכחי
              Object.assign(DB.settings,parsed.settings||{});
              Object.assign(DB.safetySettings,parsed.safetySettings||{});
              if(parsed.gameOrder)DB.gameOrder=parsed.gameOrder;
              if(parsed.gameNames)DB.gameNames=parsed.gameNames;
              if(parsed.gameHidden)DB.gameHidden=parsed.gameHidden;
              initApp();
            }
          }catch(e){}
        }
      };
    };

  // אם localStorage ריק — נסה לשחזר הגדרות מ-cookie
  const cookieSettings = loadSettingsFromCookie ? loadSettingsFromCookie() : null;
  if(cookieSettings) {
    const cookieSchema = (cookieSettings._version||'').split('.')[0];
    if(cookieSchema === SCHEMA_VERSION) {
      return {_fromCookie: true, ...cookieSettings};
    }
  }
  // נסה cookie חלופי
  const cookieB = loadSettingsFromCookieB ? loadSettingsFromCookieB() : null;
  if(cookieB) {
    const cookieBSchema = (cookieB._version||'').split('.')[0];
    if(cookieBSchema === SCHEMA_VERSION) {
      return {_fromCookie: true, ...cookieB};
    }
  }
  return null;
}

if(window._pendingCookieSettings){
  const cs=window._pendingCookieSettings;
  if(cs.settings) Object.assign(DB.settings, cs.settings);
  if(cs.safetySettings) Object.assign(DB.safetySettings, cs.safetySettings);
  if(cs.gameOrder) DB.gameOrder=cs.gameOrder;
  if(cs.gameNames) DB.gameNames=cs.gameNames;
  if(cs.gameHidden) DB.gameHidden=cs.gameHidden;
  delete window._pendingCookieSettings;
}

function saveDB(){
  if(typeof syncLegacyFromGames==='function') syncLegacyFromGames();
  if(typeof syncLegacyAliases==='function') syncLegacyAliases();
  DB._version=DB_VERSION;
  const data=JSON.stringify(DB);
  // שמירה מרובה-מקורות לעמידות מקסימלית ב-Blossom iframe
  try{localStorage.setItem('igDB',data);}catch(e){}
  try{sessionStorage.setItem('igDB',data);}catch(e){}
  // שמירת הגדרות ב-cookie (עמיד ב-iframe, עד 365 יום)
  try{
    const settingsOnly={
      _version:DB._version,
      settings:DB.settings,
      safetySettings:DB.safetySettings,
      gameOrder:DB.gameOrder,
      gameNames:DB.gameNames,
      gameHidden:DB.gameHidden
    };
    const enc=encodeURIComponent(JSON.stringify(settingsOnly));
    // SameSite=Lax עובד טוב יותר בסביבות שונות
    document.cookie='igSettings='+enc+';max-age=31536000;path=/;SameSite=Lax';
    // גם ללא Secure למקרה שה-iframe רץ ב-http
    document.cookie='igSettingsB='+enc+';max-age=31536000;path=/';
  }catch(e){}
  // שמירה ב-IndexedDB לעמידות גבוהה
  try{
    const req=indexedDB.open('igDB',1);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore('kv');};
    req.onsuccess=e=>{
      const tx=e.target.result.transaction('kv','readwrite');
      tx.objectStore('kv').put(data,'igDB');
    };
  }catch(e){}
}

function loadSettingsFromCookie(){
  try{
    const match=document.cookie.match(/(?:^|; )igSettings=([^;]*)/);
    if(!match) return null;
    return JSON.parse(decodeURIComponent(match[1]));
  }catch(e){return null;}
}
function loadSettingsFromCookieB(){
  try{
    const match=document.cookie.match(/(?:^|; )igSettingsB=([^;]*)/);
    if(!match) return null;
    return JSON.parse(decodeURIComponent(match[1]));
  }catch(e){return null;}
}

function buildAnswerSpeedSummary(state, questions) {
  if (!state || !questions || !questions.length) return { avgAnswerTime: '', answerSpeeds: '' };
  var speeds = questions.map(function (q) {
    var t = state.timers && state.timers[q.id];
    if (t === undefined || t === null || t === -1) return 'TO';
    return String(t);
  });
  var nums = speeds.filter(function (s) { return s !== 'TO'; }).map(Number);
  var avg = nums.length ? Math.round(nums.reduce(function (a, b) { return a + b; }, 0) / nums.length) : '';
  return { avgAnswerTime: avg, answerSpeeds: speeds.join(',') };
}

function sendToSheets(result) {
  const p = '?userName='+encodeURIComponent(result.userName)
          + '&score='+encodeURIComponent(result.score)
          + '&accuracy='+encodeURIComponent(result.accuracy)
          + '&level='+encodeURIComponent(result.level)
          + '&correct='+encodeURIComponent(result.correct)
          + '&total='+encodeURIComponent(result.total)
          + (result.gameType ? '&gameType='+encodeURIComponent(result.gameType) : '')
          + '&avgAnswerTime='+encodeURIComponent(result.avgAnswerTime != null ? result.avgAnswerTime : '')
          + '&answerSpeeds='+encodeURIComponent(result.answerSpeeds != null ? result.answerSpeeds : '')
          + '&mode='+encodeURIComponent(result.mode || (window._studyMode ? 'study' : 'challenge'))
          + '&t='+Date.now();
  new Image().src = SHEET_URL+p;
}

function submitDriverRegistration() {
  var first  = (document.getElementById('reg-first').value || '').trim();
  var last   = (document.getElementById('reg-last').value  || '').trim();
  var drvId  = (document.getElementById('reg-id').value    || '').trim();

  if (!first) { document.getElementById('reg-first').style.borderColor='#e63946'; document.getElementById('reg-first').focus(); return; }
  if (!last)  { document.getElementById('reg-last').style.borderColor='#e63946';  document.getElementById('reg-last').focus();  return; }
  if (!drvId) { document.getElementById('reg-id').style.borderColor='#e63946';    document.getElementById('reg-id').focus();    return; }

  var profile = {
    firstName:   first,
    lastName:    last,
    driverId:    drvId,
    displayName: buildDisplayName(first, last),
    userId:      buildUserId(drvId)
  };
  saveDriverProfile(profile);
  applyDriverProfile(profile);
  document.getElementById('nav-wrap').style.display = '';
  showPlatformLobby();
}

function applyDriverProfile(profile) {
  currentUser.name     = profile.displayName;
  currentUser.username = profile.userId;
  currentUser.driverId = profile.driverId;
  document.getElementById('u-name').textContent    = profile.displayName;
  document.getElementById('u-avatar').textContent  = profile.firstName.charAt(0);
  var editBtn = document.getElementById('edit-profile-btn');
  if (editBtn) editBtn.style.display = 'inline-block';
}

// פתיחת מודל עריכת פרטים
window.editDriverProfile = function() {
  var p = loadDriverProfile() || {};
  showModal('✏️ עדכון פרטים אישיים',
    '<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div class="form-group"><label>שם פרטי</label><input id="ep-first" value="' + (p.firstName||'') + '"></div>' +
      '<div class="form-group"><label>שם משפחה</label><input id="ep-last" value="' + (p.lastName||'') + '"></div>' +
      '<div class="form-group"><label>מספר נהג</label><input id="ep-id" value="' + (p.driverId||'') + '" style="direction:ltr;text-align:center"><p style="font-size:11px;color:#aaa;margin-top:4px">שינוי מספר נהג ישנה את המזהה — היסטוריה קודמת תישאר תחת המספר הישן</p></div>' +
    '</div>' +
    '<button class="btn-primary w100" onclick="saveEditedProfile()" style="margin-top:12px;padding:11px">שמור</button>'
  );
};

window.saveEditedProfile = function() {
  var first = (document.getElementById('ep-first').value||'').trim();
  var last  = (document.getElementById('ep-last').value ||'').trim();
  var drvId = (document.getElementById('ep-id').value   ||'').trim();
  if (!first||!last||!drvId) { alert('יש למלא את כל השדות'); return; }
  var profile = { firstName:first, lastName:last, driverId:drvId, displayName:buildDisplayName(first,last), userId:buildUserId(drvId) };
  saveDriverProfile(profile);
  applyDriverProfile(profile);
  closeModal();
};

function initApp() {
  if(typeof migrateDBPlatform==='function') migrateDBPlatform();
  loadSafetySettingsFromSheets(null);

  // וודא שהפס תמיד מוצג (אלא אם מסך רישום יסתיר אותו בהמשך)
  var navWrap = document.getElementById('nav-wrap');
  if (navWrap) navWrap.style.display = '';

  // בדוק אם מנהל מחובר
  const savedAdmin = localStorage.getItem('igAdminUser');
  if (savedAdmin) {
    try { currentUser = JSON.parse(savedAdmin); } catch(e) {}
  }

  if (currentUser.role !== 'admin') {
    // נהג — בדוק אם יש פרופיל
    var profile = loadDriverProfile();
    if (profile) {
      applyDriverProfile(profile);
    } else {
      // כניסה ראשונה — הצג מסך רישום
      document.getElementById('u-name').textContent   = 'ברוך הבא';
      document.getElementById('u-avatar').textContent = '?';
      if(!DB.gameOrder) DB.gameOrder=['game','safety'];
      if(!DB.gameNames) DB.gameNames={'game':'🎮 משחק דמו','safety':'🦺 בטיחות'};
      if(!DB.gameHidden) DB.gameHidden={'game':false,'safety':false};
      if(typeof migrateDBPlatform==='function') migrateDBPlatform();
      // הצג את ה-body ו-הסר loader לפני מסך הרישום
      document.body.style.opacity='1';
      var regLoader=document.getElementById('app-loader');
      if(regLoader){ regLoader.classList.add('fade-out'); regLoader.setAttribute('aria-busy','false'); setTimeout(function(){regLoader.remove();},300); }
      showDriverRegistration();
      return; // עצור — showPlatformLobby יקרא מ-submitDriverRegistration
    }
  } else {
    document.getElementById('u-name').textContent   = currentUser.name;
    document.getElementById('u-avatar').textContent = currentUser.name.charAt(0);
    var editBtn = document.getElementById('edit-profile-btn');
    if (editBtn) editBtn.style.display = 'none';
  }
  if(!DB.gameOrder) DB.gameOrder=['game','safety'];
  if(!DB.gameNames) DB.gameNames={'game':'🎮 משחק דמו','safety':'🦺 בטיחות'};
  if(!DB.gameHidden) DB.gameHidden={'game':false,'safety':false};
  // sync driver games that were injected
  if(typeof migrateDBPlatform==='function') migrateDBPlatform();
  // מזג שאלות חסרות מהקוד (כשה-storage ישן יותר מהקובץ)
  (function mergeMissingQuestions(){
    const codeIds = new Set((DB.safetyQuestions||[]).map(q=>q&&q.id));
    // DB.safetyQuestions כבר מכיל את כל השאלות מהקוד עם ברירות מחדל
    // אם נטען DB ממקור חיצוני עם פחות שאלות — נשלים
    if(!window._sqDefault) return; // אין רשימת ברירת מחדל
    const missing = window._sqDefault.filter(q=>!codeIds.has(q.id));
    if(missing.length) {
      DB.safetyQuestions = [...(DB.safetyQuestions||[]), ...missing];
      if(typeof persistGameQuestions==='function') persistGameQuestions('safety', DB.safetyQuestions);
    }
  })();
  // ── Build top nav tabs: for admin show topics (not individual games) + admin tabs ──
  // For players — lobby is the entry point, so playerTabs doesn't matter (they never see the nav)
  const visibleGames = typeof getVisibleGames==='function' ? getVisibleGames() : DB.gameOrder.filter(id=>!DB.gameHidden[id]).map(id=>({id,label:DB.gameNames[id]}));
  // Admin nav: show topics as tabs (each topic → first game of that topic)
  var topicTabsHtml = '';
  if (currentUser.role === 'admin') {
    var navTopics = typeof window.getTopics === 'function' ? window.getTopics() : [];
    topicTabsHtml = navTopics.map(function(t){
      var firstGid = (t.gameIds||[]).find(function(gid){
        var g = typeof getGame==='function' ? getGame(gid) : null;
        return g && !g.hidden;
      }) || (t.gameIds||[])[0] || '';
      if (!firstGid) return '';
      return '<button class="nav-tab" data-tab="' + firstGid + '" onclick="showTab(\'' + firstGid + '\')">' + t.icon + ' ' + t.name + '</button>';

      topicTabsHtml +
      '<button class="nav-tab" data-tab="questions" onclick="showTab(\'questions\')">📚 שאלות</button>' +

    const tabs = [...playerTabs, ['myresults','🏅 ההתקדמות שלי']];
    document.getElementById('nav-tabs').innerHTML = tabs.map(([id,lbl])=>
      `<button class="nav-tab" data-tab="${id}" onclick="showTab('${id}')">${lbl}</button>`).join('');
  }
  const firstG = visibleGames[0];
  const firstId = firstG && firstG.id ? firstG.id : (DB.gameOrder.find(id=>!DB.gameHidden[id]) || DB.gameOrder[0]);
  const firstGameName = typeof getGameLabel==='function' && getGame(firstId) ? getGameLabel(getGame(firstId)) : (DB.gameNames[firstId]||'🎯 משחק זיהוי תמונה');

  // Show platform lobby for players, or first game for admin
  if(currentUser.role !== 'admin') {
    showPlatformLobby();
  } else {
    showTab(firstId);
  }
  document.body.style.opacity='1';
  const loader=document.getElementById('app-loader');
  if(loader){
    loader.classList.add('fade-out');
    loader.setAttribute('aria-busy','false');
    setTimeout(function(){loader.remove();},300);
  }
}

  var profile = loadDriverProfile();
  currentUser = {

    name:     profile ? profile.displayName : 'חניך',
    driverId: profile ? profile.driverId : '',

function showTab(id, direct) {
  if (safetyState && safetyState.adminDemo) stopSafetyAdminDemo(false);
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  const mc=document.getElementById('mc');

  // If this game is the "entry point" for a topic tab — open topic folder
  // UNLESS direct=true (called from inside the topic folder to launch the game directly)
  if (!direct && currentUser.role === 'admin' && typeof window.getTopics === 'function') {
    var navTopics = window.getTopics();
    var isTopicEntry = navTopics.some(function(t){
      var firstVisible = (t.gameIds||[]).find(function(gid){
        var g = typeof getGame==='function' ? getGame(gid) : null;
        return g && !g.hidden;
      }) || (t.gameIds||[])[0];
      return firstVisible === id;
    });
    if (isTopicEntry && typeof showTopicFolder === 'function') {
      var topicForId = navTopics.find(function(t){
        var firstVisible = (t.gameIds||[]).find(function(gid){
          var g = typeof getGame==='function' ? getGame(gid) : null;
          return g && !g.hidden;
        }) || (t.gameIds||[])[0];
        return firstVisible === id;
      });
      if (topicForId) { showTopicFolder(topicForId.id); return; }
    }
  }

  const game = typeof getGame==='function' ? getGame(id) : null;
  if(game && GAME_REGISTRY && GAME_REGISTRY[game.templateId] && GAME_REGISTRY[game.templateId].renderLobby) {
    return GAME_REGISTRY[game.templateId].renderLobby(mc, game);
  }
  ({questions:renderQuestions,reports:renderReports,config:renderConfig,myresults:renderMyResults,advisor:renderAdvisor}[id]||function(c){var g=getGame&&getGame('game');if(g&&GAME_REGISTRY.image_timed)GAME_REGISTRY.image_timed.renderLobby(c,g);else renderGame(c);})(mc);
}

          { q: 'סדר נוהל תקלת חשמל: עצירה בטוחה / דיווח למוקד / פינוי נוסעים / נעילת דלתות / המתנה להוראות' }
        ]
      };
    }

    // drag_drop
    if (action === 'match' || material === 'pairs') {
      return { template: 'drag_drop', title: 'גרירה והתאמה',

          { q: 'חבר כל רמזור לפעולה הנכונה: אדום / ירוק / צהוב / לבן מהבהב ← עצור / המשך / האט / שים לב' },

        ]
      };

    // image_hotspot

      html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px">' +

      html += '</div></div>';

    } else if (s === 1) {

      html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px">' +

    } else if (s === 2) {
      // Material question
      var domainData2 = DOMAINS.find(function(d) { return d.id === state.domain; });
      var step2D2 = STEP2[state.domain];
      var actionLabel = step2D2.opts.find(function(o) { return o.id === state.action; });
      html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:12px">' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
          '<span style="font-size:12px;background:#eff6ff;color:#1d4ed8;padding:3px 9px;border-radius:20px;border:1px solid #bfdbfe">' + (domainData2 ? domainData2.icon + ' ' + domainData2.name : '') + '</span>' +
          '<span style="font-size:12px;background:#f5f3ff;color:#5b21b6;padding:3px 9px;border-radius:20px;border:1px solid #c4b5fd">' + (actionLabel ? actionLabel.label : '') + '</span>' +
        '</div>' +
        '<p style="font-size:14px;font-weight:600;color:#1a1a2e;margin:0 0 10px">' + STEP3.q + '</p>' +
        '<div style="display:flex;flex-direction:column;gap:6px">';
      STEP3.opts.forEach(function(opt) {
        html += '<button onclick="window._advMaterial(\'' + opt.id + '\')" style="text-align:right;padding:10px 14px;background:#f8f9ff;border:1.5px solid #e0e7ff;border-radius:9px;font-size:13px;color:#1a1a2e;cursor:pointer" ' +
          'onmouseover="this.style.borderColor=\'#4361ee\';this.style.background=\'#eff6ff\'" ' +
          'onmouseout="this.style.borderColor=\'#e0e7ff\';this.style.background=\'#f8f9ff\'">' + opt.label + '</button>';
      });
      html += '</div></div>' +
        '<button onclick="window._advBack()" style="font-size:12px;color:#888;background:none;border:none;cursor:pointer;padding:4px 0">← חזור</button>';

    } else if (s === 3) {
      // Result
      var result = decide(state.domain, state.action, state.material);
      var color = TEMPLATE_COLORS[result.template] || '#4361ee';
      html += '<div style="background:#fff;border:2px solid ' + color + ';border-radius:12px;padding:18px;margin-bottom:12px">' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
          '<span style="font-size:24px">✅</span>' +
          '<div>' +
            '<div style="font-size:11px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.05em">המלצה</div>' +
            '<div style="font-size:17px;font-weight:700;color:' + color + '">' + result.title + '</div>' +
          '</div>' +
        '</div>' +
        '<p style="font-size:13px;color:#374151;margin:0 0 8px;line-height:1.6"><strong>למה?</strong> ' + result.why + '</p>' +
        '<div style="background:#f0f9ff;border-radius:8px;padding:10px 12px;font-size:12px;color:#0369a1;margin-bottom:14px">' +
          '💡 <strong>טיפ:</strong> ' + result.tip +
        '</div>' +
        '<div style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:8px">שאלות לדוגמה — מוכנות להעתקה:</div>' +
        result.examples.map(function(ex, i) {
          return '<div style="background:#f8f9ff;border:1px solid #e0e7ff;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:12px;color:#374151;line-height:1.6;cursor:pointer" ' +
            'onclick="navigator.clipboard&&navigator.clipboard.writeText(' + JSON.stringify(ex.q) + ').then(function(){var el=document.querySelectorAll(\'.ex-copy\')[' + i + '];if(el){el.textContent=\'✓ הועתק\';setTimeout(function(){el.textContent=\'העתק\'},1500)}})" ' +
            'title="לחץ להעתקה">' +
            ex.q +
            '<span class="ex-copy" style="display:block;text-align:left;font-size:10px;color:#4361ee;margin-top:4px">העתק</span>' +
          '</div>';
        }).join('') +
        '</div>' +
        '<button onclick="window._advOpenWizard(\'' + result.template + '\')" style="width:100%;padding:12px;background:' + color + ';color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px">' +
          '🚀 צור משחק מסוג זה עכשיו' +
        '</button>' +
        '<button onclick="window._advReset()" style="width:100%;padding:10px;background:transparent;color:#888;border:1px solid #e0e7ff;border-radius:10px;font-size:13px;cursor:pointer">' +
          '↺ התחל מחדש' +
        '</button>';
    }

    html += '</div>';
    mc.innerHTML = html;
  }

  // Handlers
  window._advDomain = function(id) { state.domain = id; state.step = 1; renderStep(); };
  window._advAction = function(id) { state.action = id; state.step = 2; renderStep(); };
  window._advMaterial = function(id) { state.material = id; state.step = 3; renderStep(); };
  window._advBack = function() { state.step = Math.max(0, state.step - 1); renderStep(); };
  window._advReset = function() { state = { step: 0, domain: null, action: null, material: null }; renderStep(); };
  window._advOpenWizard = function(templateId) {
    // Open the new game wizard with the template pre-selected
    if (typeof openGameWizard === 'function') {
      openGameWizard(templateId);
    } else {
      // Fallback: switch to questions tab
      showTab('questions');
      setTimeout(function() {
        var wizBtn = document.querySelector('[onclick*="openGameWizard"]');
        if (wizBtn) wizBtn.click();
      }, 200);
    }
  };

  renderStep();
}

// ── משחק ────────────────────────────────────────────────────────
function renderGame(mc) {
  if(typeof GAME_REGISTRY!=='undefined'&&GAME_REGISTRY.image_timed&&getGame('game')){GAME_REGISTRY.image_timed.renderLobby(mc,getGame('game'));return;}
  const s=DB.settings;
  const savedName = localStorage.getItem('igPlayerName')||'';
  const showNameBox = s.requireName !== false;
  const gameName = DB.gameNames['game']||'🎮 משחק דמו';
  mc.innerHTML = `
    <div class="game-wrapper">
      <div class="card" id="gp" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 48px;max-width:760px;width:100%;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.10)">
        <div style="text-align:center;margin-bottom:28px">
          <div style="font-size:72px;line-height:1;margin-bottom:16px">🎮</div>
          <h2 style="font-size:28px;font-weight:800;color:#1a1a2e;margin-bottom:6px">${gameName}</h2>
          <p style="color:#777;font-size:15px">התבונן בתמונה ואחר כך ענה על השאלה</p>
        </div>
        ${showNameBox ? `<div style="background:#f7f9ff;border-radius:12px;padding:20px 24px;margin-bottom:24px;text-align:center">
          <p style="font-size:15px;font-weight:700;margin-bottom:12px;color:#1a1a2e">👤 מה שמך?</p>
          <input id="pname" placeholder="הכנס שם מלא" value="${savedName}" style="max-width:320px;margin:0 auto;display:block;text-align:center;font-size:16px;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:8px;outline:none;width:100%">
          ${savedName ? '<p style=\'font-size:12px;color:#aaa;margin-top:8px\'>שם שמור — ניתן לשנות</p>' : ''}
        </div>` : `<input type="hidden" id="pname" value="${savedName||'שחקן'}">`}
        <div style="display:flex;justify-content:center;gap:32px;margin-bottom:28px;font-size:14px;color:#555">
          <span>⏱️ זמן תמונה: <b style="color:#1a1a2e">${s.imageDisplayTime}s</b></span>
          <span>⏱️ זמן תשובה: <b style="color:#1a1a2e">${s.answerTime}s</b></span>
          <span>❓ שאלות: <b style="color:#1a1a2e">${s.questionsPerSession}</b></span>
        </div>
        <div style="text-align:center">
          <button class="btn-primary" onclick="startGameWithName()" style="padding:16px 56px;font-size:17px;font-weight:700;border-radius:12px;box-shadow:0 4px 14px rgba(67,97,238,.3)">▶ התחל משחק</button>
        </div>
      </div>

}

function startGameWithName() {
  const inp = document.getElementById('pname');
  const name = inp ? inp.value.trim() : '';
  const req = DB.settings.requireName !== false;
  if (!name && req) {
    if(inp){inp.style.border='2px solid var(--danger)';setTimeout(()=>inp.style.border='1.5px solid #e0e0e0',1500);}
    inp.focus(); return;
  }
  if(name) {
    localStorage.setItem('igPlayerName', name);
    currentUser.name = name; currentUser.username = name;
    document.getElementById('u-name').textContent = name;
    document.getElementById('u-avatar').textContent = name.charAt(0);
  }
  startGame();
}

function enterFullscreen() {
  /* CSS .fullscreen-game only — native API shows distracting mobile banner */
}
function exitFullscreen() {
  /* no-op — see enterFullscreen */
}
function startGame() {
  var game = typeof getGame==='function' ? getGame('game') : null;
  if(game && GAME_REGISTRY && GAME_REGISTRY.image_timed && GAME_REGISTRY.image_timed.startGame) {
    return GAME_REGISTRY.image_timed.startGame(game);
  }
  enterFullscreen();
  const mc=document.getElementById('mc');
  if(mc)mc.classList.add('fullscreen-game');
  const active=(DB.questions||[]).filter(q=>q&&q.active);
  if(!active.length){alert('אין שאלות!');return;}
  const selected=[...active].sort(()=>Math.random()-.5).slice(0,Math.min(DB.settings.questionsPerSession,active.length));
  gameState={questions:selected,current:0,answers:{},timers:{},score:0,correct:0,startTimes:{}};
  renderQuestion();
}

function renderQuestion() {
  clearInterval(timerInt);
  const{questions,current}=gameState;
  if(current>=questions.length){endGame();return;}
  const q=questions[current],total=questions.length,pct=Math.round((current/total)*100);
  const s=DB.settings;
  const combined = s.showAnswerWithImage !== false;
  document.getElementById('gp').innerHTML=`
    <div class="progress-row">
      <span class="progress-label">שאלה ${current+1}/${total}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">⭐ ${gameState.score}</span>
    </div>
    <div class="image-stage">
      <img src="${q.img}" id="gimg" alt="תמונה" style="opacity:0;transition:opacity .3s">
      ${!combined ? `<div class="stage-overlay" id="sov">
        ${s.showCountdown!==false?`<div class="big-num" id="icd">${s.imageDisplayTime}</div>`:''}
      </div>` : ''}
    </div>
    <div class="question-text" id="qtxt" style="${combined?'':'opacity:0'}"></div>
    <div class="answer-grid ${combined?'':'hidden'}" id="agrid"></div>
    <div class="timer-row ${combined?'':'hidden'}" id="trow">
      <div class="timer-display" id="tnum">${s.answerTime}</div>
      <div class="timer-track"><div class="timer-fill" id="tfill" style="width:100%"></div></div>
    </div>`;
  const gimgEl=document.getElementById('gimg');
  const startImgTimer=()=>{
    if(gimgEl) gimgEl.style.opacity='1';
    if(combined){
      // מצב combined: תמונה + שאלה + תשובות יחד, תזמון התשובה מיד
      const qtxt=document.getElementById('qtxt'),agrid=document.getElementById('agrid'),trow=document.getElementById('trow');
      if(qtxt){qtxt.style.opacity='1';qtxt.textContent=q.text;}
      const sh=[0,1,2,3].sort(()=>Math.random()-.5);
      const dOpts=sh.map(i=>q.options[i]);
      q._dc=sh.indexOf(q.correct);
      if(agrid)agrid.innerHTML=dOpts.map((opt,i)=>`<button class="answer-btn" onclick="pick(${i})">${opt}</button>`).join('');
      if(trow)trow.classList.remove('hidden');
      let al=s.answerTime;
      gameState.startTimes[q.id]=Date.now();
      timerInt=setInterval(()=>{
        al--;
        const tn=document.getElementById('tnum'),tf=document.getElementById('tfill');
        if(tn){tn.textContent=al;if(al<=5)tn.classList.add('urgent');}
        if(tf){tf.style.width=Math.round((al/s.answerTime)*100)+'%';if(al<=5)tf.classList.add('urgent');}
        if(al<=0){clearInterval(timerInt);timeOut(q);}
      },1000);
    } else {
      // מצב קלאסי: תמונה רצה לפרק זמן, אחר כך שאלה
      let imgLeft=s.imageDisplayTime;
      const cdEl=document.getElementById('icd');
      if(cdEl)cdEl.textContent=imgLeft;
      timerInt=setInterval(()=>{
        imgLeft--;
        const el=document.getElementById('icd');
        if(el)el.textContent=imgLeft;
        if(imgLeft<=0){clearInterval(timerInt);showAnswerPhase(q);}
      },1000);
    }
  };
  if(gimgEl && gimgEl.complete && gimgEl.naturalWidth>0){
    startImgTimer();
  } else if(gimgEl){
    gimgEl.onload=startImgTimer;
    gimgEl.onerror=startImgTimer;
  }
  // preload תמונה הבאה
  if(questions[current+1]){const pre=new Image();pre.src=questions[current+1].img;}
}

function showAnswerPhase(q) {
  const sh=[0,1,2,3].sort(()=>Math.random()-.5);
  const dOpts=sh.map(i=>q.options[i]);
  q._dc=sh.indexOf(q.correct);
  const sov=document.getElementById('sov'),gimg=document.getElementById('gimg');
  const qtxt=document.getElementById('qtxt'),agrid=document.getElementById('agrid'),trow=document.getElementById('trow');
  if(gimg){gimg.style.display='none';}
  const imgStage=gimg?gimg.closest('.image-stage'):null;
  if(imgStage){
    imgStage.style.background='#000';
    const sovEl=document.getElementById('sov');
    if(sovEl)sovEl.style.display='none';
  }
  if(qtxt){qtxt.style.opacity='1';qtxt.textContent=q.text;}
  if(agrid)agrid.innerHTML=dOpts.map((opt,i)=>`<button class="answer-btn" onclick="pick(${i})">${opt}</button>`).join('');
  if(trow)trow.classList.remove('hidden');
  let al=DB.settings.answerTime;
  const total=al;
  gameState.startTimes[q.id]=Date.now();
  const tn0=document.getElementById('tnum'),tf0=document.getElementById('tfill');
  if(tn0){tn0.textContent=al;if(al<=5)tn0.classList.add('urgent');}
  if(tf0){tf0.style.width='100%';if(al<=5)tf0.classList.add('urgent');}
  timerInt=setInterval(()=>{
    al--;
    const tn=document.getElementById('tnum'),tf=document.getElementById('tfill');
    if(tn){tn.textContent=al;if(al<=5)tn.classList.add('urgent');else tn.classList.remove('urgent');}
    if(tf){tf.style.width=Math.round((al/total)*100)+'%';if(al<=5)tf.classList.add('urgent');else tf.classList.remove('urgent');}
    if(al<=0){clearInterval(timerInt);timeOut(q);}
  },1000);
}

function pick(idx) {
  clearInterval(timerInt);
  const q=gameState.questions[gameState.current];
  const elapsed=Math.round((Date.now()-(gameState.startTimes[q.id]||Date.now()))/1000);
  gameState.timers[q.id]=elapsed;
  gameState.answers[q.id]=idx;
  const ok=idx===q._dc;
  document.querySelectorAll('.answer-btn').forEach((b,i)=>{b.disabled=true;if(i===q._dc)b.classList.add('correct');else if(i===idx&&!ok)b.classList.add('wrong');});
  if(ok){let pts=DB.settings.pointsPerCorrect;if(DB.settings.bonusForSpeed&&elapsed<DB.settings.answerTime*.35)pts=Math.round(pts*1.5);gameState.score+=pts;gameState.correct++;}
  const tn=document.getElementById('tnum');if(tn)tn.textContent='✓';
  setTimeout(()=>{gameState.current++;renderQuestion();},1300);
}

function timeOut(q) {
  gameState.answers[q.id]=-1;
  if (!gameState.timers) gameState.timers = {};
  gameState.timers[q.id] = -1;
  document.querySelectorAll('.answer-btn').forEach((b,i)=>{b.disabled=true;if(i===q._dc)b.classList.add('correct');});
  setTimeout(()=>{gameState.current++;renderQuestion();},1300);
}

function endGame() {
  exitFullscreen();
  const mc=document.getElementById('mc');
  if(mc)mc.classList.remove('fullscreen-game');
  const total=gameState.questions.length,correct=gameState.correct,acc=Math.round((correct/total)*100);
  let level='מתחיל',lc='badge-warning';
  if(acc>=85){level='מומחה';lc='badge-success';}else if(acc>=65){level='מתקדם';lc='badge-info';}
  const speed=buildAnswerSpeedSummary(gameState,gameState.questions);
  const r={id:'r'+Date.now(),userId:currentUser.username,userName:currentUser.name,score:gameState.score,correct,total,accuracy:acc,level,date:new Date().toISOString(),avgAnswerTime:speed.avgAnswerTime,answerSpeeds:speed.answerSpeeds};
  DB.results.unshift(r);saveDB();
  sendToSheets(r);
  document.getElementById('gp').innerHTML=`
    <div class="results-card">
      <div class="result-score">${r.score}</div>
      <div class="result-label">נקודות סה"כ</div>
      <div><span class="level-badge ${lc}">${level}</span></div>
      <div class="result-stats">
        <div class="stat-box"><div class="stat-val">${correct}/${total}</div><div class="stat-lbl">תשובות נכונות</div></div>
        <div class="stat-box"><div class="stat-val">${acc}%</div><div class="stat-lbl">דיוק</div></div>
        <div class="stat-box"><div class="stat-val">${r.score}</div><div class="stat-lbl">ניקוד</div></div>
      </div>
      <div class="flex gap2 center">
        <button class="btn-primary" onclick="renderGame(document.getElementById('mc'))" style="padding:10px 28px">שחק שוב</button>
        <button class="btn-ghost" onclick="showTab('myresults')" style="padding:10px 28px">ההישגים שלי</button>
      </div>
    </div>`;
}

// ── התוצאות שלי ─────────────────────────────────────────────────
function renderMyResults(mc) {
  const games = typeof getAllGames==='function' ? getAllGames() : [{id:'game'},{id:'safety'}];
  const topics = typeof window.getTopics==='function' ? window.getTopics() : [];

  const byGame = games.map(function(g){
    const gid = g.id || g;
    const rows = typeof getGameResults==='function'
      ? getGameResults(gid).filter(function(r){return r.userId===currentUser.username;})
      : (gid==='safety'?(DB.safetyResults||[]):DB.results||[]).filter(function(r){return r.userId===currentUser.username;});
    return {id:gid, label:typeof getGameLabel==='function'?getGameLabel(g):(DB.gameNames[gid]||gid), icon:g.icon||'🎮', rows:rows};
  });

  const allRes = byGame.reduce(function(a,g){return a.concat(g.rows);},[]);
  if(!allRes.length){
    mc.innerHTML='<div style="text-align:center;padding:60px 20px">' +
      '<div style="font-size:56px;margin-bottom:16px">📊</div>' +
      '<div style="font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px">עדיין אין תוצאות</div>' +
      '<div style="font-size:14px;color:#888;margin-bottom:24px">שחק לפחות משחק אחד כדי לראות את ההתקדמות שלך</div>' +
      '<button onclick="showPlatformLobby()" style="padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">← לכל הנושאים</button>' +
      '</div>';
    return;
  }

  const avg = Math.round(allRes.reduce((s,r)=>s+r.accuracy,0)/allRes.length);
  const best = Math.max(...allRes.map(r=>r.score));
  const totalGames = allRes.length;
  const gamesThisWeek = allRes.filter(function(r){
    return r.date && (Date.now()-new Date(r.date).getTime()) < 7*24*60*60*1000;
  }).length;

  // Overall level
  var overallLevel = avg >= 85 ? 'מומחה' : avg >= 65 ? 'מתקדם' : 'מתחיל';
  var levelColor = avg >= 85 ? '#2dc653' : avg >= 65 ? '#4361ee' : '#f59e0b';

  // ── Summary cards ──
  var summaryHtml =
    '<div class="admin-grid" style="margin-bottom:20px">' +
      '<div class="stat-card"><div class="num">' + totalGames + '</div><div class="lbl">משחקים</div></div>' +
      '<div class="stat-card"><div class="num">' + avg + '%</div><div class="lbl">דיוק ממוצע</div></div>' +
      '<div class="stat-card"><div class="num">' + best + '</div><div class="lbl">ניקוד שיא</div></div>' +
      '<div class="stat-card"><div class="num">' + gamesThisWeek + '</div><div class="lbl">השבוע</div></div>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)">' +
      '<div style="font-size:28px">🏅</div>' +
      '<div><div style="font-size:13px;color:#888;margin-bottom:2px">רמה כללית</div>' +
      '<span style="font-size:16px;font-weight:800;color:' + levelColor + '">' + overallLevel + '</span></div>' +
      '<div style="flex:1;margin-right:16px">' +
        '<div style="height:8px;background:#eee;border-radius:4px;overflow:hidden">' +
          '<div style="height:100%;width:' + avg + '%;background:' + levelColor + ';border-radius:4px;transition:width .6s"></div>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:13px;font-weight:700;color:' + levelColor + '">' + avg + '%</div>' +
    '</div>';

  // ── Per-topic breakdown ──
  var topicsHtml = '';
  topics.forEach(function(topic){
    var topicGames = (topic.gameIds||[]).map(function(gid){
      return byGame.find(function(g){ return g.id === gid; });
    }).filter(Boolean);
    var topicRows = topicGames.reduce(function(a,g){ return a.concat(g.rows); }, []);
    if (!topicRows.length) return; // skip topics with no play history

    var topicAcc = Math.round(topicRows.reduce((s,r)=>s+r.accuracy,0)/topicRows.length);
    var topicBarColor = topicAcc >= 85 ? '#2dc653' : topicAcc >= 65 ? '#4361ee' : '#f59e0b';
    var accent = topic.color || '#4361ee';

    // Per-game rows inside this topic
    var gameRowsHtml = topicGames.map(function(g){
      if (!g.rows.length) return '';
      var gameAcc = Math.round(g.rows.reduce((s,r)=>s+r.accuracy,0)/g.rows.length);
      var gameBest = Math.max(...g.rows.map(r=>r.score));
      var lastDate = g.rows.length ? new Date(g.rows[0].date).toLocaleDateString('he-IL') : '';
      var gameBarColor = gameAcc >= 85 ? '#2dc653' : gameAcc >= 65 ? '#4361ee' : '#f59e0b';
      var levelLbl = g.rows[0] && g.rows[0].level ? g.rows[0].level : '';

function startSafetyWithName() {
