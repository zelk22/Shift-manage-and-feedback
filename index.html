<!DOCTYPE html>
<html lang="he" dir="rtl" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- חסימה מוחלטת של מנגנוני התרגום האוטומטי של גוגל, אפל ושאר הדפדפנים בטלפונים -->
    <meta name="google" content="notranslate" />
    <meta name="google" content="nopagereader" />
    
    <title>צ'אט בוט נדל"ן</title>
    
    <style>
        /* איפוס והכנת העמוד למסך מלא לחלוטין בניידים ובמחשב */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* מיכל האייפרם שתופס את כל שטח המסך בצורה נקייה */
        .chat-container {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body class="notranslate">

    <!-- המיכל שמציג את הבוט במסך מלא ומסומן כלא מיועד לתרגום -->
    <div class="chat-container notranslate">
        <!-- הקישור המדויק של הבוט שלך מוטמע כאן בפנים -->
        <iframe 
            src="https://cdn.botpress.cloud/webchat/v3.6/shareable.html?configUrl=https://files.bpcontent.cloud/2026/05/28/05/20260528054019-BJA7KHOQ.json" 
            title="בוט נדלן"
            allow="geolocation; microphone; camera">
        </iframe>
    </div>

</body>
</html>
