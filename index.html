let safetyState={};

function clearSafetyAdminTimers() {
  clearInterval(timerInt);
  timerInt = null;
  if (safetyAdvanceTimeout) {
    clearTimeout(safetyAdvanceTimeout);
    safetyAdvanceTimeout = null;
  }
}

function scheduleSafetyAdvance(ms) {
  const delay = ms || 1300;
  if (safetyAdvanceTimeout) clearTimeout(safetyAdvanceTimeout);
  if (safetyState.adminDemo) {
    safetyState.phase = 'feedback';
    safetyState.feedbackEndAt = Date.now() + delay;
    if (safetyState.paused) {
      safetyState.feedbackLeft = delay;
      return;
    }
  }
  safetyAdvanceTimeout = setTimeout(() => {
    if (safetyState.adminDemo) {
      safetyState.feedbackEndAt = null;
      safetyState.feedbackLeft = null;
    }
    safetyState.current++;
    if(typeof renderImageTimedQuestion==='function') renderImageTimedQuestion(); else renderSafetyQuestion();
  }, delay);
}

function startSafetyImageCountdown(q, imgLeft) {
  const game = safetyState.game || (typeof getGame==='function' ? getGame(safetyState.gameId || 'safety') : null);
  const s = game && typeof getGameSettings==='function' ? getGameSettings(game) : DB.safetySettings;
  if (safetyState.adminDemo) safetyState.phase = 'image';
  let left = imgLeft;
  const cdEl = document.getElementById('sicd');
  if (cdEl) cdEl.textContent = left;
  timerInt = setInterval(() => {
    if (safetyState.adminDemo && safetyState.paused) return;
    left--;
    const el = document.getElementById('sicd');
    if (el) el.textContent = left;
    if (safetyState.adminDemo) safetyState.timerLeft = left;
    if (left <= 0) { clearInterval(timerInt); timerInt = null; if(typeof showImageTimedAnswerPhase==='function') showImageTimedAnswerPhase(q); else showSafetyAnswerPhase(q); }
  }, 1000);
}

function startSafetyAnswerCountdown(q, al) {
  const game = safetyState.game || (typeof getGame==='function' ? getGame(safetyState.gameId || 'safety') : null);
  // Study mode: no timer countdown
  if (window._studyMode && !safetyState.adminDemo) {
    const tn0s = document.getElementById('stnum'), tf0s = document.getElementById('stfill');
    if (tn0s) { tn0s.textContent = '∞'; tn0s.classList.remove('urgent'); }
    if (tf0s) { tf0s.style.width = '100%'; tf0s.classList.remove('urgent'); }
    safetyState.startTimes = safetyState.startTimes || {};
    safetyState.startTimes[q.id] = Date.now();
    return; // No timer in study mode
  }
  const total = al;
  if (safetyState.adminDemo) safetyState.phase = 'answer';
  const tn0 = document.getElementById('stnum'), tf0 = document.getElementById('stfill');
  if (tn0) { tn0.textContent = al; if (al <= 5) tn0.classList.add('urgent'); else tn0.classList.remove('urgent'); }
  if (tf0) { tf0.style.width = '100%'; if (al <= 5) tf0.classList.add('urgent'); else tf0.classList.remove('urgent'); }
  if (safetyState.adminDemo) safetyState.timerLeft = al;
  timerInt = setInterval(() => {
    if (safetyState.adminDemo && safetyState.paused) return;
    al--;
    const tn = document.getElementById('stnum'), tf = document.getElementById('stfill');
    if (tn) { tn.textContent = al; if (al <= 5) tn.classList.add('urgent'); else tn.classList.remove('urgent'); }
    if (tf) { tf.style.width = Math.round((al / total) * 100) + '%'; if (al <= 5) tf.classList.add('urgent'); else tf.classList.remove('urgent'); }
    if (safetyState.adminDemo) safetyState.timerLeft = al;
    if (al <= 0) { clearInterval(timerInt); timerInt = null; timeOutSafety(q); }
  }, 1000);
}

function getSafetyAdminBarHtml(current, total) {
  const paused = safetyState.paused;
  const hasPrev = current > 0;
  const hasNext = current < total - 1;
  return `<div class="safety-admin-bar" id="safety-admin-bar">
    <span class="safety-admin-label">דמו מנהל · תמונה ${current + 1}/${total}</span>
    <div class="safety-admin-actions">
      <button type="button" id="sadm-pause-btn" onclick="toggleSafetyAdminPause()">${paused ? '▶ המשך' : '⏸ השהה'}</button>
      <button type="button" onclick="stepSafetyAdminDemo(-1)" ${!hasPrev ? 'disabled' : ''}>◀ הקודם</button>
      <button type="button" onclick="stepSafetyAdminDemo(1)" ${!hasNext ? 'disabled' : ''}>הבא ▶</button>
      <button type="button" onclick="startSpImgEdit()" title="ערוך מיקום וזום">✏️</button>
      <button type="button" onclick="stopSafetyAdminDemo()" class="sadm-exit">⏹ יציאה</button>
    </div>
  </div>`;
}

function updateAdminPauseButton() {
  const btn = document.getElementById('sadm-pause-btn');
  if (btn) btn.textContent = safetyState.paused ? '▶ המשך' : '⏸ השהה';
}

function getSafetyAdminDemoQuestions() {
  var game = typeof getGame==='function' ? getGame('safety') : null;
  if(game && typeof getAdminDemoQuestions==='undefined' && typeof getGameQuestions==='function') return getGameQuestions('safety').filter(q => q && q.id && q.active);
  if(game && typeof getImageTimedSessionQuestions!=='function') return getGameQuestions('safety').filter(q => q && q.id && q.active);
  return (DB.safetyQuestions || []).filter(q => q && q.id && q.active);
}

function ensureSafetyGameShell() {
  let sgp = document.getElementById('sgp');
  if (sgp) return sgp;
  const mc = document.getElementById('mc');
  if (!mc) return null;
  mc.innerHTML = '<div class="game-wrapper"><div class="card" id="sgp"></div></div>';
  return document.getElementById('sgp');
}

function onSafetyAdminDemoKey(e) {
  if (!safetyState || !safetyState.adminDemo) return;
  if (e.key === ' ') { e.preventDefault(); toggleSafetyAdminPause(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepSafetyAdminDemo(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepSafetyAdminDemo(1); }
  if (e.key === 'Escape') { e.preventDefault(); stopSafetyAdminDemo(); }
}

function startSafetyAdminDemo(startAt) {
  if (currentUser.role !== 'admin') return;
  var game = typeof getGame==='function' ? getGame('safety') : null;
  if(game && GAME_REGISTRY && GAME_REGISTRY.image_timed && GAME_REGISTRY.image_timed.startAdminDemo) {
    return GAME_REGISTRY.image_timed.startAdminDemo(game, startAt);
  }
  const questions = getSafetyAdminDemoQuestions();
  if (!questions.length) { alert('אין שאלות פעילות בטיחות!'); return; }
  if (!ensureSafetyGameShell()) return;
  enterFullscreen();
  const mc = document.getElementById('mc');
  if (mc) mc.classList.add('fullscreen-game', 'safety-preview-run');
  const initial = typeof startAt === 'number' ? Math.max(0, Math.min(startAt, questions.length - 1)) : 0;
  safetyState = {
    adminDemo: true, paused: false, phase: 'image',
    questions, current: initial, score: 0, correct: 0, startTimes: {},
    timerLeft: null, feedbackLeft: null, feedbackEndAt: null
  };
  document.removeEventListener('keydown', onSafetyAdminDemoKey);
  document.addEventListener('keydown', onSafetyAdminDemoKey);
  if(typeof renderImageTimedQuestion==='function') renderImageTimedQuestion(); else renderSafetyQuestion();
}

function stopSafetyAdminDemo(returnToQuestions) {
  clearSafetyAdminTimers();
  clearSpImgEdit();
  exitFullscreen();
  const mc = document.getElementById('mc');
  if (mc) mc.classList.remove('fullscreen-game', 'safety-preview-run', 'safety-admin-paused');
  document.removeEventListener('keydown', onSafetyAdminDemoKey);
  safetyState = {};
  if (returnToQuestions !== false) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'questions'));
    renderQuestions(document.getElementById('mc'));
  }
}

function toggleSafetyAdminPause() {
  if (!safetyState.adminDemo) return;
  if (safetyState.paused) {
    resumeSafetyAdminTimer();
  } else {
    pauseSafetyAdminTimer();
  }
}

function pauseSafetyAdminTimer() {
  safetyState.paused = true;
  clearInterval(timerInt);
  timerInt = null;
  const tn = document.getElementById('stnum');
  const cd = document.getElementById('sicd');
  if (tn && tn.textContent && !isNaN(parseInt(tn.textContent, 10))) {
    safetyState.timerLeft = parseInt(tn.textContent, 10);
  } else if (cd && cd.textContent && !isNaN(parseInt(cd.textContent, 10))) {
    safetyState.timerLeft = parseInt(cd.textContent, 10);
  }
  if (safetyState.phase === 'feedback' && safetyState.feedbackEndAt) {
    safetyState.feedbackLeft = Math.max(0, safetyState.feedbackEndAt - Date.now());
    if (safetyAdvanceTimeout) { clearTimeout(safetyAdvanceTimeout); safetyAdvanceTimeout = null; }
  }
  document.querySelectorAll('#sagrid button').forEach(b => { b.disabled = true; });
  const mc = document.getElementById('mc');
  if (mc) mc.classList.add('safety-admin-paused');
  updateAdminPauseButton();
}

function resumeSafetyAdminTimer() {
  if (!safetyState.adminDemo || !safetyState.paused) return;
  safetyState.paused = false;
  const mc = document.getElementById('mc');
  if (mc) mc.classList.remove('safety-admin-paused');
  const q = safetyState.questions[safetyState.current];
  const game = safetyState.game || (typeof getGame==='function' ? getGame(safetyState.gameId || 'safety') : null);
  const s = game && typeof getGameSettings==='function' ? getGameSettings(game) : DB.safetySettings;
  const combined = s.showAnswerWithImage !== false;

  if (safetyState.phase === 'feedback') {
    scheduleSafetyAdvance(safetyState.feedbackLeft || 1300);
    updateAdminPauseButton();
    return;
  }

  if (safetyState.phase === 'image' && !combined) {
    startSafetyImageCountdown(q, safetyState.timerLeft != null ? safetyState.timerLeft : s.imageDisplayTime);
  } else if (safetyState.phase === 'answer') {
    const sagrid = document.getElementById('sagrid');
    if (sagrid) sagrid.querySelectorAll('button').forEach(b => { b.disabled = false; });
    startSafetyAnswerCountdown(q, safetyState.timerLeft != null ? safetyState.timerLeft : s.answerTime);
  }
  updateAdminPauseButton();
}

function stepSafetyAdminDemo(delta) {
  if (!safetyState.adminDemo) return;
  if (spImgEdit) cancelSpImgEdit();
  const next = safetyState.current + delta;
  if (next < 0 || next >= safetyState.questions.length) return;
  clearSafetyAdminTimers();
  safetyState.current = next;
  safetyState.paused = false;
  safetyState.timerLeft = null;
  safetyState.feedbackLeft = null;
  safetyState.feedbackEndAt = null;
  if(typeof renderImageTimedQuestion==='function') renderImageTimedQuestion(); else renderSafetyQuestion();
}

function endSafetyAdminDemo() {
  clearSafetyAdminTimers();
  clearSpImgEdit();
  const total = safetyState.questions.length;
  const correct = safetyState.correct;
  const acc = Math.round((correct / total) * 100);
  const score = safetyState.score;
  let level = 'מתחיל', lc = 'badge-warning';
  if (acc >= 85) { level = 'מומחה'; lc = 'badge-success'; }
  else if (acc >= 65) { level = 'מתקדם'; lc = 'badge-info'; }
  safetyState.phase = 'done';
  document.getElementById('sgp').innerHTML = `
    <div class="safety-admin-bar">
      <span class="safety-admin-label">דמו מנהל — סיום</span>
      <div class="safety-admin-actions">
        <button type="button" onclick="stopSafetyAdminDemo()" class="sadm-exit">⏹ חזרה לשאלות</button>
      </div>
    </div>
    <div class="results-card">
      <div class="result-score">${score}</div>
      <div class="result-label">נקודות סה"כ (דמו — לא נשמר)</div>
      <div><span class="level-badge ${lc}">${level}</span></div>
      <div class="result-stats">
        <div class="stat-box"><div class="stat-val">${correct}/${total}</div><div class="stat-lbl">תשובות נכונות</div></div>
        <div class="stat-box"><div class="stat-val">${acc}%</div><div class="stat-lbl">דיוק</div></div>
        <div class="stat-box"><div class="stat-val">${score}</div><div class="stat-lbl">ניקוד</div></div>
      </div>
      <div class="flex gap2 center">
        <button class="btn-primary" onclick="startSafetyAdminDemo(0)" style="padding:10px 28px;background:#7c3aed">הרץ דמו שוב</button>
        <button class="btn-ghost" onclick="stopSafetyAdminDemo()" style="padding:10px 28px">חזרה לשאלות</button>
      </div>
    </div>`;
}

function startSafetyGame() {
  loadSafetySettingsFromSheets(function(){
    _doStartSafetyGame();
  });
}
function _doStartSafetyGame() {
  var game = typeof getGame==='function' ? getGame('safety') : null;
  if(game && GAME_REGISTRY && GAME_REGISTRY.image_timed && GAME_REGISTRY.image_timed.startGame) {
    return GAME_REGISTRY.image_timed.startGame(game);
  }
  enterFullscreen();
  const mc=document.getElementById('mc');
  if(mc)mc.classList.add('fullscreen-game');
  const selected=getSafetySessionQuestions();
  if(!selected.length){alert('אין שאלות בטיחות תואמות לסינון הנוכחי!');return;}
  safetyState={questions:selected,current:0,score:0,correct:0,startTimes:{},timers:{}};
  if(typeof renderImageTimedQuestion==='function') renderImageTimedQuestion(); else renderSafetyQuestion();
}

function renderSafetyQuestion() {
  if(typeof renderImageTimedQuestion==='function') return renderImageTimedQuestion();
  clearSafetyAdminTimers();
  const{questions,current}=safetyState;
  if(current>=questions.length){endSafetyGame();return;}
  const q=questions[current],total=questions.length,pct=Math.round((current/total)*100);
  const s=DB.safetySettings;
  const combined = s.showAnswerWithImage !== false;
  const isDemo = !!safetyState.adminDemo;
  const adminBar = isDemo ? getSafetyAdminBarHtml(current, total) : '';
  const editFab = isDemo ? `<button type="button" class="sp-img-edit-fab" onclick="event.stopPropagation();startSpImgEdit()" title="ערוך מיקום וזום">✏️</button>
    <div class="sp-img-edit-panel hidden" id="sg-img-edit-panel">
      <div class="sp-img-edit-readout">X: <span id="sp-pos-x">50</span>% · Y: <span id="sp-pos-y">50</span>% · זום: <span id="sp-zoom-val">100</span>%</div>
      <div class="sp-img-edit-actions">
        <button type="button" class="sp-zoom-btn" onclick="spZoomDelta(-5)" title="הקטן">−</button>
        <button type="button" class="sp-zoom-btn" onclick="spZoomDelta(5)" title="הגדל">+</button>
        <button type="button" class="sp-img-save" onclick="saveSpImgEdit()">💾 שמור</button>
        <button type="button" class="sp-img-cancel" onclick="cancelSpImgEdit()">✕</button>
      </div>
    </div>` : '';

  document.getElementById('sgp').innerHTML=`
    ${adminBar}
    <div class="progress-row">
      <span class="progress-label">תמונה ${current+1}/${total}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">⭐ ${safetyState.score}</span>
    </div>
    <div class="image-stage" id="sstage">
      ${editFab}

      ${!combined ? `<div class="stage-overlay" id="ssov" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff">${s.showCountdown!==false?`<div class="big-num" id="sicd">${s.imageDisplayTime}</div>`:''}</div>` : ''}
    </div>
    <div class="question-text" id="sqtxt" style="font-size:20px;${combined?'':'opacity:0'}">נוסע או עוצר?</div>
    <div class="answer-grid ${combined?'':'hidden'}" id="sagrid" style="grid-template-columns:1fr 1fr;max-width:400px;margin:0 auto 14px">

      <div class="timer-track"><div class="timer-fill" id="stfill" style="width:100%"></div></div>
    </div>`;

  if (isDemo) {
    safetyState.phase = combined ? 'answer' : 'image';
    safetyState.paused = false;
    safetyState.timerLeft = null;
    safetyState.feedbackLeft = null;
    safetyState.feedbackEndAt = null;
  }

  const imgEl = document.getElementById('sgimg');
  if (imgEl) applySafetyImgStyle(imgEl, q);

  if (isDemo && spImgEdit && spImgEdit.qId === q.id) {
    const panel = document.getElementById('sg-img-edit-panel');
    if (panel) panel.classList.remove('hidden');
    updateSpImgEditUI();
    initSpImgEditHandlers();
  }

  const startMainTimer = () => {
    if(imgEl) imgEl.style.opacity='1';
    const sstageEl=document.getElementById('sstage');
    if(sstageEl) sstageEl.style.background='#fff';
    if(combined) {
      const sagrid=document.getElementById('sagrid');
      if(sagrid) sagrid.querySelectorAll('button').forEach(b=>b.disabled=false);
      safetyState.startTimes[q.id]=Date.now();
      startSafetyAnswerCountdown(q, s.answerTime);
    } else {
      startSafetyImageCountdown(q, s.imageDisplayTime);
    }
  };

  if(imgEl.complete && imgEl.naturalWidth>0) {
    startMainTimer();
  } else {
    imgEl.onload = startMainTimer;
    imgEl.onerror = startMainTimer;
  }

  if(questions[current+1]) {
    const preload = new Image();
    preload.src = questions[current+1].img;
  }
}

function showSafetyAnswerPhase(q) {
  if(typeof showImageTimedAnswerPhase==='function') return showImageTimedAnswerPhase(q);

  }

  if(strow)strow.classList.remove('hidden');

}

function pickSafety(answer) {
  if(typeof pickImageTimed==='function' && safetyState && safetyState.gameId) return pickImageTimed(answer);
  clearSafetyAdminTimers();
  const q=safetyState.questions[safetyState.current];
  const elapsed=Math.round((Date.now()-(safetyState.startTimes[q.id]||Date.now()))/1000);
  if (!safetyState.timers) safetyState.timers = {};
  safetyState.timers[q.id] = elapsed;
  const ok=answer===q.correct;
  const s=DB.safetySettings;
  document.querySelectorAll('#sagrid button').forEach(b=>b.disabled=true);
  const yesBtn=document.getElementById('sbtn-yes'),noBtn=document.getElementById('sbtn-no');
  if(ok){
    let pts=s.pointsPerCorrect;
    if(s.bonusForSpeed&&elapsed<s.answerTime*.35)pts=Math.round(pts*1.5);
    safetyState.score+=pts;safetyState.correct++;
    (answer==='נוסע'?yesBtn:noBtn).style.cssText+='border-width:3px;box-shadow:0 0 0 3px #2dc65340';
  } else {
    (answer==='נוסע'?yesBtn:noBtn).style.cssText+='opacity:0.4';
    (q.correct==='נוסע'?yesBtn:noBtn).style.cssText+='border-width:3px;box-shadow:0 0 0 3px #2dc65340';
  }
  const tn=document.getElementById('stnum');if(tn)tn.textContent=ok?'✓':'✗';
  scheduleSafetyAdvance(1300);
}

function timeOutSafety(q) {
  if (!safetyState.timers) safetyState.timers = {};
  safetyState.timers[q.id] = -1;
  document.querySelectorAll('#sagrid button').forEach(b=>b.disabled=true);
  const yesBtn=document.getElementById('sbtn-yes'),noBtn=document.getElementById('sbtn-no');
  (q.correct==='נוסע'?yesBtn:noBtn).style.cssText+='border-width:3px;box-shadow:0 0 0 3px #2dc65340';
  scheduleSafetyAdvance(1300);
}

function endSafetyGame() {
  if(typeof endImageTimedGame==='function' && safetyState && (safetyState.gameId || safetyState.game)) return endImageTimedGame();
  if (safetyState.adminDemo) { endSafetyAdminDemo(); return; }
  exitFullscreen();

function getImgPos(q) {
  const x = (q && q.imgPosX != null) ? q.imgPosX : 50;
  const y = (q && q.imgPosY != null) ? q.imgPosY : 50;
  return x + '% ' + y + '%';
}
function getImgZoom(q) {
  const z = (q && q.imgZoom != null) ? q.imgZoom : 100;
  return Math.max(100, Math.min(200, Math.round(z)));
}
function isMobileGameView() {
  return window.matchMedia('(max-width:768px)').matches;
}
function applyGameImgLayout(img, x, y, zoom) {
  const mobile = isMobileGameView();
  img.style.objectFit = mobile ? 'contain' : 'cover';
  img.style.objectPosition = x + '% ' + y + '%';
  if (mobile) {
    img.style.maxWidth = '100%';
    img.style.maxHeight = 'calc(100vh - 310px)';
    img.style.width = 'auto';
    img.style.height = 'auto';
  } else {
    img.style.maxWidth = '';
    img.style.maxHeight = '';
    img.style.width = '';
    img.style.height = '';
  }
  const s = zoom / 100;
  if (s !== 1) {
    img.style.transform = 'scale(' + s + ')';
    img.style.transformOrigin = x + '% ' + y + '%';
  } else {
    img.style.transform = '';
    img.style.transformOrigin = '';
  }
}
function applySafetyImgStyle(img, q) {
  if (!img || !q) return;
  const x = (q.imgPosX != null) ? q.imgPosX : 50;
  const y = (q.imgPosY != null) ? q.imgPosY : 50;
  applyGameImgLayout(img, x, y, getImgZoom(q));
}
function applyImgPosFields(q) {
  const xEl = document.getElementById('eq-pos-x');
  const yEl = document.getElementById('eq-pos-y');
  if (xEl) q.imgPosX = parseInt(xEl.value, 10);
  if (yEl) q.imgPosY = parseInt(yEl.value, 10);
}
function updateImgPosPreview() {
  const prev = document.getElementById('eq-preview');
  const xEl = document.getElementById('eq-pos-x');
  const yEl = document.getElementById('eq-pos-y');
  if (!prev || !xEl || !yEl) return;
  const x = parseInt(xEl.value, 10) || 0;
  const y = parseInt(yEl.value, 10) || 0;
  prev.style.objectFit = 'cover';
  prev.style.objectPosition = x + '% ' + y + '%';
  const xLbl = document.getElementById('eq-pos-x-val');
  const yLbl = document.getElementById('eq-pos-y-val');
  if (xLbl) xLbl.textContent = x + '%';
  if (yLbl) yLbl.textContent = y + '%';
}

let _eqDrag = null;

function setImgPosValues(x, y) {
  x = Math.max(0, Math.min(100, Math.round(x)));
  y = Math.max(0, Math.min(100, Math.round(y)));
  const xEl = document.getElementById('eq-pos-x');
  const yEl = document.getElementById('eq-pos-y');
  if (xEl) xEl.value = x;
  if (yEl) yEl.value = y;
  updateImgPosPreview();
}

function initEditSQPosDrag(posX, posY) {
  setImgPosValues(posX, posY);
  const frame = document.getElementById('eq-preview-frame');
  const img = document.getElementById('eq-preview');
  if (!frame || !img) return;

  const onPointerDown = (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    _eqDrag = {
      startX: e.clientX,
      startY: e.clientY,
      posX: parseInt(document.getElementById('eq-pos-x').value, 10) || 50,
      posY: parseInt(document.getElementById('eq-pos-y').value, 10) || 50,
      moved: false,
      w: frame.clientWidth || 1,
      h: frame.clientHeight || 1
    };
    frame.classList.add('eq-dragging');
    frame.setPointerCapture(e.pointerId);
    e.preventDefault();
  };

  const onPointerMove = (e) => {
    if (!_eqDrag) return;
    const dx = e.clientX - _eqDrag.startX;
    const dy = e.clientY - _eqDrag.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) _eqDrag.moved = true;
    setImgPosValues(
      _eqDrag.posX - (dx / _eqDrag.w) * 100,
      _eqDrag.posY - (dy / _eqDrag.h) * 100
    );
  };

  const endDrag = (e) => {
    if (!_eqDrag) return;
    const wasDrag = _eqDrag.moved;
    _eqDrag = null;
    frame.classList.remove('eq-dragging');
    try { frame.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!wasDrag && img.src) {
      previewImg(img.src, img.dataset.correct || '', img.dataset.diff || 'קל', img.dataset.loc || '');
    }
  };

  frame.onpointerdown = onPointerDown;
  frame.onpointermove = onPointerMove;
  frame.onpointerup = endDrag;
  frame.onpointercancel = endDrag;
}

let spImgEdit = null;
let _spDrag = null;
let _spPinch = null;

function getSpEditContext() {

function clampSpZoom(z) {
  return Math.max(100, Math.min(200, Math.round(z)));
}

function applySpImgDraft(img, draft) {
  if (!img || !draft) return;
  applyGameImgLayout(img, draft.x, draft.y, draft.zoom);
}

function updateSpImgEditUI() {
  if (!spImgEdit) return;
  const ctx = getSpEditContext();
  applySpImgDraft(ctx.img, spImgEdit);
  const xEl = document.getElementById('sp-pos-x');
  const yEl = document.getElementById('sp-pos-y');

  if (xEl) xEl.textContent = Math.round(spImgEdit.x);
  if (yEl) yEl.textContent = Math.round(spImgEdit.y);
  if (zEl) zEl.textContent = Math.round(spImgEdit.zoom);
}

function setSpImgDraft(x, y, zoom) {
  if (!spImgEdit) return;
  spImgEdit.x = Math.max(0, Math.min(100, Math.round(x)));
  spImgEdit.y = Math.max(0, Math.min(100, Math.round(y)));
  spImgEdit.zoom = clampSpZoom(zoom);
  updateSpImgEditUI();
}

function spZoomDelta(delta) {
  if (!spImgEdit) return;
  setSpImgDraft(spImgEdit.x, spImgEdit.y, spImgEdit.zoom + delta);
}

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy) || 1;
}

function teardownSpImgEditHandlers() {
  ['sp-image-stage', 'sstage'].forEach(id => {
    const stage = document.getElementById(id);
    if (!stage) return;
    stage.onpointerdown = null;
    stage.onpointermove = null;
    stage.onpointerup = null;
    stage.onpointercancel = null;
    stage.ontouchstart = null;
    stage.ontouchmove = null;
    stage.ontouchend = null;
    stage.ontouchcancel = null;
    stage.classList.remove('sp-editing', 'sp-dragging');
  });
}

function initSpImgEditHandlers() {
  const stage = getSpEditContext().stage;
  if (!stage || !spImgEdit) return;
  stage.classList.add('sp-editing');

  const onPointerDown = (e) => {
    if (!spImgEdit || e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.sp-img-edit-panel')) return;
    _spDrag = {
      startX: e.clientX,
      startY: e.clientY,
      posX: spImgEdit.x,
      posY: spImgEdit.y,
      w: stage.clientWidth || 1,
      h: stage.clientHeight || 1
    };
    stage.classList.add('sp-dragging');
    stage.setPointerCapture(e.pointerId);
    e.preventDefault();
  };

  const onPointerMove = (e) => {
    if (!_spDrag || !spImgEdit) return;
    const dx = e.clientX - _spDrag.startX;
    const dy = e.clientY - _spDrag.startY;
    setSpImgDraft(
      _spDrag.posX - (dx / _spDrag.w) * 100,
      _spDrag.posY - (dy / _spDrag.h) * 100,
      spImgEdit.zoom
    );
  };

  const endPointer = (e) => {
    if (!_spDrag) return;
    _spDrag = null;
    stage.classList.remove('sp-dragging');
    try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  };

  stage.onpointerdown = onPointerDown;
  stage.onpointermove = onPointerMove;
  stage.onpointerup = endPointer;
  stage.onpointercancel = endPointer;

  stage.ontouchstart = (e) => {
    if (!spImgEdit || e.touches.length !== 2) return;
    _spPinch = { dist: touchDist(e.touches), zoom: spImgEdit.zoom };
    e.preventDefault();
  };
  stage.ontouchmove = (e) => {
    if (!spImgEdit || !_spPinch || e.touches.length !== 2) return;
    const dist = touchDist(e.touches);
    const ratio = dist / _spPinch.dist;
    setSpImgDraft(spImgEdit.x, spImgEdit.y, _spPinch.zoom * ratio);
    e.preventDefault();
  };
  const endPinch = () => { _spPinch = null; };
  stage.ontouchend = endPinch;
  stage.ontouchcancel = endPinch;
}

function startSpImgEdit() {
  const q = getCurrentSpEditQuestion();
  if (!q) return;
  const x = q.imgPosX != null ? q.imgPosX : 50;
  const y = q.imgPosY != null ? q.imgPosY : 50;
  const zoom = getImgZoom(q);
  spImgEdit = { x, y, zoom, origX: x, origY: y, origZoom: zoom, qId: q.id };
  const ctx = getSpEditContext();
  const panel = document.getElementById(ctx.panelId);
  if (panel) panel.classList.remove('hidden');
  updateSpImgEditUI();
  initSpImgEditHandlers();
}

function cancelSpImgEdit() {
  if (!spImgEdit) return;
  setSpImgDraft(spImgEdit.origX, spImgEdit.origY, spImgEdit.origZoom);
  spImgEdit = null;
  teardownSpImgEditHandlers();
  const ctx = getSpEditContext();
  const panel = document.getElementById(ctx.panelId);
  if (panel) panel.classList.add('hidden');
  const q = getCurrentSpEditQuestion();
  if (ctx.img && q) applySafetyImgStyle(ctx.img, q);
}

function saveSpImgEdit() {
  if (!spImgEdit) return;
  const dbQ = (DB.safetyQuestions || []).find(x => x && x.id === spImgEdit.qId);
  const previewQ = safetyPreviewState && safetyPreviewState.questions.find(x => x && x.id === spImgEdit.qId);
  const demoQ = safetyState && safetyState.adminDemo && safetyState.questions.find(x => x && x.id === spImgEdit.qId);
  const vals = {
    imgPosX: Math.round(spImgEdit.x),
    imgPosY: Math.round(spImgEdit.y),
    imgZoom: clampSpZoom(spImgEdit.zoom)
  };
  if (dbQ) Object.assign(dbQ, vals);
  if (previewQ) Object.assign(previewQ, vals);
  if (demoQ) Object.assign(demoQ, vals);
  saveDB();
  spImgEdit = null;
  teardownSpImgEditHandlers();
  const ctx = getSpEditContext();
  const panel = document.getElementById(ctx.panelId);
  if (panel) panel.classList.add('hidden');
  const q = demoQ || previewQ || dbQ;
  if (ctx.img && q) applySafetyImgStyle(ctx.img, q);
}

function clearSpImgEdit() {
  spImgEdit = null;
  _spDrag = null;
  _spPinch = null;
  teardownSpImgEditHandlers();
}

let safetyPreviewState = null;

function getSafetySessionQuestions() {
  const s=DB.safetySettings;
  let active=(DB.safetyQuestions||[]).filter(q=>q&&q.active);
  if(s.filterLocation&&s.filterLocation!=='הכל') active=active.filter(q=>q&&q.loc===s.filterLocation);
  if(s.filterDiff&&s.filterDiff!=='הכל') active=active.filter(q=>q&&q.diff===s.filterDiff);
  return [...active].sort(()=>Math.random()-.5).slice(0,Math.min(s.questionsPerSession,active.length));
}

function ensureSafetyPreviewOverlay() {
  let el = document.getElementById('safety-preview-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'safety-preview-overlay';
    el.className = 'safety-preview-overlay hidden';
    document.body.appendChild(el);
  }
  return el;
}

function getSafetyPreviewQuestions() {
  return (DB.safetyQuestions || []).filter(q => q && q.id);
}

function openSafetyGamePreview(startAt) {
  const questions = getSafetyPreviewQuestions();
  if (!questions.length) {
    alert('אין שאלות בטיחות ברשימה!');
    return;
  }
  const initial = typeof startAt === 'number' ? Math.max(0, Math.min(startAt, questions.length - 1)) : 0;
  safetyPreviewState = { questions, current: initial };
  ensureSafetyPreviewOverlay().classList.remove('hidden');
  document.addEventListener('keydown', onSafetyPreviewKey);
  renderSafetyPreviewQuestion();
}

function closeSafetyGamePreview() {
  clearSpImgEdit();
  const el = document.getElementById('safety-preview-overlay');
  if (el) el.classList.add('hidden');
  document.removeEventListener('keydown', onSafetyPreviewKey);
  safetyPreviewState = null;
}

function onSafetyPreviewKey(e) {
  if (!safetyPreviewState) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepSafetyPreview(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepSafetyPreview(1); }
  if (e.key === 'Escape') { e.preventDefault(); closeSafetyGamePreview(); }
}

function stepSafetyPreview(delta) {
  if (!safetyPreviewState) return;
  if (spImgEdit) cancelSpImgEdit();
  const next = safetyPreviewState.current + delta;
  if (next < 0 || next >= safetyPreviewState.questions.length) return;
  safetyPreviewState.current = next;
  renderSafetyPreviewQuestion();
}

function gotoSafetyPreviewQuestion() {
  if (!safetyPreviewState) return;
  const inp = document.getElementById('sp-goto-num');
  const total = safetyPreviewState.questions.length;
  const num = parseInt(inp && inp.value, 10);
  if (!num || num < 1 || num > total) {
    alert('הזן מספר שאלה בין 1 ל-' + total);
    return;
  }
  safetyPreviewState.current = num - 1;
  renderSafetyPreviewQuestion();
}

      </div>

    const panel = document.getElementById('sp-img-edit-panel');
    if (panel) panel.classList.remove('hidden');

function pickSafetyPreview(answer) {
  if (!safetyPreviewState) return;
  const q = safetyPreviewState.questions[safetyPreviewState.current];
  const ok = answer === q.correct;
  const grid = document.getElementById('sp-answer-grid');
  const feedback = document.getElementById('sp-feedback');
  if (grid) grid.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const yesBtn = document.getElementById('sp-btn-yes');
  const noBtn = document.getElementById('sp-btn-no');
  if (yesBtn) {
    yesBtn.style.borderColor = q.correct === 'נוסע' ? '#2dc653' : (answer === 'נוסע' ? '#e63946' : '#e0e0e0');
    yesBtn.style.background = q.correct === 'נוסע' ? '#d4f5e2' : (answer === 'נוסע' ? '#fde8e8' : '#fff');
  }
  if (noBtn) {
    noBtn.style.borderColor = q.correct === 'עוצר' ? '#2dc653' : (answer === 'עוצר' ? '#e63946' : '#e0e0e0');
    noBtn.style.background = q.correct === 'עוצר' ? '#d4f5e2' : (answer === 'עוצר' ? '#fde8e8' : '#fff');
  }
  if (feedback) {
    feedback.style.color = ok ? '#16803a' : '#c0392b';
    feedback.textContent = ok ? '✓ נכון — ' + q.correct : '✗ שגוי — התשובה: ' + q.correct;
  }
}

    initEditSQPosDrag(q.imgPosX != null ? q.imgPosX : 50, q.imgPosY != null ? q.imgPosY : 50);

// סיבוב זמני — מספר מעלות שנצברו מאז פתיחת החלון
let _rotateDeg = 0;
let _currentEditImg = ''; // תמונה נוכחית בעריכה

function rotatePreview(deg){
  _rotateDeg = ((_rotateDeg + deg) % 360 + 360) % 360;
  const prev = document.getElementById('eq-preview');
  if(prev) prev.style.transform = `rotate(${_rotateDeg}deg)`;
}

// איפוס סיבוב בעת פתיחת editSQ (בקריאה מחדש)
function resetRotate(){ _rotateDeg = 0; }

function saveEditSQ(id, continueNext){
  const allQ = (DB.safetyQuestions||[]).filter(q=>q&&q.id);
  const qIdx = allQ.findIndex(q=>q.id===id);
  const q = allQ[qIdx];
  if(!q)return;

  // אם בוצע סיבוב — אפה לתוך base64
  const doSave = (imgSrc) => {
    if(_rotateDeg !== 0){
      const tmpImg = new Image();
      tmpImg.onload = ()=>{
        const canvas = document.createElement('canvas');
        const rad = _rotateDeg * Math.PI / 180;
        const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));
        const w = tmpImg.naturalWidth, h = tmpImg.naturalHeight;
        canvas.width  = Math.round(w * cos + h * sin);
        canvas.height = Math.round(w * sin + h * cos);
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(rad);
        ctx.drawImage(tmpImg, -w/2, -h/2);
        q.img = canvas.toDataURL('image/jpeg', 0.88);
        _currentEditImg = q.img;
        q.correct = document.getElementById('sqcorrect').value;
        q.diff    = document.getElementById('eq-diff').value;
        q.loc     = document.getElementById('eq-loc').value.trim();
        applyImgPosFields(q);
        saveDB();
        finishSave();
      };
      tmpImg.src = imgSrc;
      return; // המשך async
    } else {
      const imgEl = document.getElementById('eq-img');
      const newUrl = imgEl ? imgEl.value.trim() : '';
      if(newUrl && !newUrl.startsWith('[')) q.img = newUrl;
      // אם שדה ריק — q.img נשאר כפי שהוא
    }
    q.correct = document.getElementById('sqcorrect').value;
    q.diff    = document.getElementById('eq-diff').value;
    q.loc     = document.getElementById('eq-loc').value.trim();
    var expEl = document.getElementById('eq-explanation');
    if (expEl) q.explanation = expEl.value.trim();
    applyImgPosFields(q);
    saveDB();
    finishSave();
  };

  const finishSave = () => {
    const cont = document.getElementById('q-content');
    if(continueNext) {
      // השתמש ב-DB הנוכחי (לא ב-closure ישן) למציאת התמונה הבאה
      const freshQ = (DB.safetyQuestions||[]).filter(x=>x&&x.id);
      const freshIdx = freshQ.findIndex(x=>x.id===id);
      const nextQ = freshIdx >= 0 && freshIdx < freshQ.length-1 ? freshQ[freshIdx+1] : null;
      closeModal();
      if(nextQ) editSQ(nextQ.id);
      else if(cont) renderSafetyQuestions(cont);
    } else {
      closeModal();
      if(cont) renderSafetyQuestions(cont);
    }
  };

  doSave(_currentEditImg);
}

function selectSQAnswer(val,btn){
  document.getElementById('sqcorrect').value=val;
  document.getElementById('sq-yes').style.borderColor='#e0e0e0';document.getElementById('sq-yes').style.background='#fff';
  document.getElementById('sq-no').style.borderColor='#e0e0e0';document.getElementById('sq-no').style.background='#fff';
  btn.style.borderColor=val==='נוסע'?'#2dc653':'#e63946';
  btn.style.background=val==='נוסע'?'#d4f5e2':'#fde8e8';
}

function submitSQ(){
  const img=document.getElementById('sqi').value.trim(),correct=document.getElementById('sqcorrect').value;
  const diff=document.getElementById('sqdiff').value,loc=document.getElementById('sqloc').value.trim();
  if(!img){alert('הכנס URL תמונה');return;}
  if(!correct){alert('בחר תשובה נכונה');return;}
  const qs = typeof getGameQuestions==='function' ? getGameQuestions('safety') : (DB.safetyQuestions||[]);
  qs.push({id:'sq'+Date.now(),img,correct,diff,loc,active:true,imgPosX:50,imgPosY:50,imgZoom:100});
  if(typeof persistGameQuestions==='function') persistGameQuestions('safety',qs); else DB.safetyQuestions=qs;
  saveDB();closeModal();
  const cont=document.getElementById('q-content');
  if(cont)renderQuestions(document.getElementById('mc'),'safety');
}
function toggleSQ(id){
  const qs = typeof getGameQuestions==='function' ? getGameQuestions('safety') : (DB.safetyQuestions||[]);
  const q=qs.find(q=>q.id===id);if(q){q.active=!q.active;if(typeof persistGameQuestions==='function') persistGameQuestions('safety',qs);saveDB();renderQuestions(document.getElementById('mc'),'safety');}
}
function delSQ(id){if(!confirm('למחוק?'))return;
  const qs = (typeof getGameQuestions==='function' ? getGameQuestions('safety') : (DB.safetyQuestions||[])).filter(q=>q.id!==id);
  if(typeof persistGameQuestions==='function') persistGameQuestions('safety',qs); else DB.safetyQuestions=qs;
  saveDB();renderQuestions(document.getElementById('mc'),'safety');
}
function buildTopicGameTabs(activeGameId, onClickFn) {
  // Row 1: topic labels — clickable, navigate to first game of that topic
  // Row 2: games of the active topic — clickable
  const topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
  const allGames = typeof getAllGames === 'function' ? getAllGames() : [];

  // Find which topic contains the active game
  var activeTopic = topics.find(function(t){ return (t.gameIds||[]).indexOf(activeGameId) >= 0; });
  if (!activeTopic && topics.length) activeTopic = topics[0];
  var activeTopicId = activeTopic ? activeTopic.id : null;

  // Row 1: topic tabs — clicking navigates to that topic's first game
  var topicRow = topics.map(function(t){
    var isActive = t.id === activeTopicId;
    var firstGid = (t.gameIds||[])[0] || '';
    if (!firstGid) return '';
    return '<button class="nav-tab' + (isActive ? ' active' : '') + '" onclick="(' + onClickFn + ')(\'' + firstGid + '\')" ' +
      'style="' + (isActive ? '' : 'background:transparent;color:#555;') + '">' +
      t.icon + ' ' + t.name + '</button>';
  }).filter(Boolean).join('');

  // Row 2: game tabs for the active topic — clickable
  var gamesInTopic = activeTopic ? (activeTopic.gameIds||[]) : allGames.map(function(g){return g.id;});
  var gameRow = gamesInTopic.map(function(gid){
    var gameObj = typeof getGame === 'function' ? getGame(gid) : null;
    if (!gameObj) return '';
    var lbl = typeof getGameLabel === 'function' ? getGameLabel(gameObj) : (gameObj.name||gid);
    var isActive = gid === activeGameId;
    return '<button class="nav-tab' + (isActive?' active':'') + '" onclick="(' + onClickFn + ')(\'' + gid + '\')">' + lbl + '</button>';
  }).filter(Boolean).join('');

  return '<div style="margin-bottom:18px">' +
    '<div class="nav-tabs" style="display:inline-flex;margin-bottom:6px;flex-wrap:wrap">' + topicRow + '</div>' +
    (gameRow ? '<div class="nav-tabs" style="display:inline-flex;background:#e8f0fe;flex-wrap:wrap">' + gameRow + '</div>' : '') +
    '</div>';
}

function renderQuestions(mc, tab) {
  const games = typeof getAllGames==='function' ? getAllGames() : (typeof getVisibleGames==='function' ? getVisibleGames() : []);
  let activeTab = tab || (games[0] && games[0].id) || 'safety';
  if (typeof getGame==='function' && getGame(activeTab) && getGame(activeTab).hidden) activeTab = games[0] && games[0].id;
  mc.innerHTML=`
    <div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:20px;font-weight:700">📚 ניהול שאלות</h2>
    </div>
    ${buildTopicGameTabs(activeTab, 'function(gid){renderQuestions(document.getElementById(\'mc\'),gid)}')}
    <div id="q-content"></div>`;
  const game = typeof getGame==='function' ? getGame(activeTab) : null;
  const cont = document.getElementById('q-content');
  if(game && GAME_REGISTRY && GAME_REGISTRY[game.templateId] && GAME_REGISTRY[game.templateId].renderQuestionsAdmin) {
    GAME_REGISTRY[game.templateId].renderQuestionsAdmin(cont, game);
  } else if(activeTab==='safety') renderSafetyQuestions(cont);
  else renderDemoQuestions(cont);
}

function submitQ(){
  const img=document.getElementById('ni').value.trim(),txt=document.getElementById('nt').value.trim();
  const opts=[0,1,2,3].map(i=>document.getElementById('no'+i).value.trim());
  if(!img||!txt||opts.some(o=>!o)){alert('מלא את כל השדות');return;}
  const qs = typeof getGameQuestions==='function' ? getGameQuestions('game') : DB.questions;
  qs.push({id:'q'+Date.now(),text:txt,options:opts,correct:0,img,cat:document.getElementById('nc').value||'כללי',diff:document.getElementById('nd').value,active:true});
  if(typeof persistGameQuestions==='function') persistGameQuestions('game',qs); else DB.questions=qs;
  saveDB();closeModal();renderQuestions(document.getElementById('mc'),'game');
}
function toggleQ(id){
  const qs = typeof getGameQuestions==='function' ? getGameQuestions('game') : DB.questions;
  const q=qs.find(q=>q.id===id);if(q){q.active=!q.active;if(typeof persistGameQuestions==='function') persistGameQuestions('game',qs);saveDB();renderQuestions(document.getElementById('mc'),'game');}
}
function delQ(id){if(!confirm('למחוק?'))return;
  const qs = (typeof getGameQuestions==='function' ? getGameQuestions('game') : DB.questions).filter(q=>q.id!==id);
  if(typeof persistGameQuestions==='function') persistGameQuestions('game',qs); else DB.questions=qs;
  saveDB();renderQuestions(document.getElementById('mc'),'game');
}

var _sheetsResultsCache = null;
var _sheetsResultsCacheTime = 0;
var _sheetsResultsCacheTTL = 2 * 60 * 1000; // 2 דקות

function loadResultsFromSheets(callback) {
  var now = Date.now();
  if (_sheetsResultsCache && (now - _sheetsResultsCacheTime) < _sheetsResultsCacheTTL) {
    callback(_sheetsResultsCache); return;
  }
  var url = SHEET_URL + '?action=getResults&t=' + now;
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var rows = Array.isArray(data) ? data : (data.results || data.rows || []);
      // normalize fields
      rows = rows.map(function(r){
        return {
          userId: r.userId || r.userName || r.name || '',
          userName: r.userName || r.name || r.userId || '',
          score: Number(r.score)||0,
          accuracy: Number(r.accuracy)||0,
          level: r.level||'',
          correct: Number(r.correct)||0,
          total: Number(r.total)||0,
          gameType: r.gameType||r.game||'',
          date: r.date||r.timestamp||'',
          mode: r.mode||'',
          avgAnswerTime: r.avgAnswerTime||'',
          _fromSheets: true
        };
      });
      _sheetsResultsCache = rows;
      _sheetsResultsCacheTime = now;
      callback(rows);
    })
    .catch(function(){ callback([]); });
}

function renderReports(mc, tab, selectedUser) {
  // הצג spinner בזמן טעינה מ-Sheets
  mc.innerHTML = '<div style="text-align:center;padding:60px;color:#888"><div style="font-size:32px;margin-bottom:12px">📊</div>טוען נתונים...</div>';

  loadResultsFromSheets(function(sheetsRows) {
    _renderReportsInner(mc, tab, selectedUser, sheetsRows);
  });
}

function _renderReportsInner(mc, tab, selectedUser, sheetsRows) {
  const games = typeof getAllGames==='function' ? getAllGames() : [];
  const topics = typeof window.getTopics==='function' ? window.getTopics() : [];
  let activeTab = tab || 'all';

  // ── Tab strip ──
  var activeTopic = activeTab !== 'all' ? topics.find(function(t){ return (t.gameIds||[]).indexOf(activeTab) >= 0; }) : null;
  var activeTopicId = activeTopic ? activeTopic.id : null;

  var topicRowHtml = '<div class="nav-tabs" style="display:inline-flex;margin-bottom:6px;flex-wrap:wrap">' +
    '<button class="nav-tab' + (activeTab==='all'?' active':'') + '" onclick="renderReports(document.getElementById(\'mc\'),\'all\')" ' +
    (activeTab==='all'?'':'style="background:transparent;color:#555;"') + '>🗂 הכל</button>' +
    topics.map(function(t){
      var isActive = t.id === activeTopicId;
      var firstGid = (t.gameIds||[])[0] || '';
      if (!firstGid) return '';
      return '<button class="nav-tab' + (isActive?' active':'') + '" onclick="renderReports(document.getElementById(\'mc\'),\'' + firstGid + '\')" ' +
        (isActive?'':'style="background:transparent;color:#555;"') + '>' + t.icon + ' ' + t.name + '</button>';
    }).filter(Boolean).join('') + '</div>';

  var gameRowHtml = '';
  if (activeTab !== 'all' && activeTopic) {
    gameRowHtml = '<div class="nav-tabs" style="display:inline-flex;margin-bottom:4px;background:#e8f0fe;flex-wrap:wrap">' +
      (activeTopic.gameIds||[]).map(function(gid){
        var g = typeof getGame==='function' ? getGame(gid) : null;
        if (!g) return '';
        var lbl = typeof getGameLabel==='function' ? getGameLabel(g) : (g.name||gid);
        return '<button class="nav-tab' + (gid===activeTab?' active':'') + '" onclick="renderReports(document.getElementById(\'mc\'),\'' + gid + '\')">' + lbl + '</button>';
      }).filter(Boolean).join('') + '</div>';
  }
  var tabStripHtml = '<div style="margin-bottom:18px">' + topicRowHtml + gameRowHtml + '</div>';

  // ── Collect & merge results: localStorage + Sheets ──
  var localRows = [];
  games.forEach(function(g){
    var gRes = typeof getGameResults==='function' ? getGameResults(g.id) : [];
    var gLabel = typeof getGameLabel==='function' ? getGameLabel(g) : g.name;
    gRes.forEach(function(r){ localRows.push(Object.assign({}, r, {_gameName: gLabel, gameType: r.gameType||g.id})); });
  });

  // Merge: deduplicate by id, prefer local
  var localIds = new Set(localRows.map(function(r){ return r.id; }));
  var sheetsOnly = (sheetsRows||[]).filter(function(r){
    var key = r.userId + '|' + r.date + '|' + r.score;
    // attach gameName from gameType
    var g = r.gameType ? (typeof getGame==='function' ? getGame(r.gameType) : null) : null;
    r._gameName = g ? (typeof getGameLabel==='function' ? getGameLabel(g) : g.name) : (r.gameType||'');
    return !localIds.has(r.id);
  });

  var allRows = localRows.concat(sheetsOnly);
  allRows.sort(function(a,b){ return new Date(b.date||0) - new Date(a.date||0); });

  // Filter by tab
  var res = activeTab === 'all' ? allRows : allRows.filter(function(r){
    return r.gameType === activeTab || (r.id && r.gameType === activeTab);
  });

  const total = res.length;
  const avgS = total ? Math.round(res.reduce((s,r)=>s+r.score,0)/total) : 0;
  const avgA = total ? Math.round(res.reduce((s,r)=>s+r.accuracy,0)/total) : 0;

  // ── Build user map ──
  const byUser = {};
  res.forEach(function(r){
    var uid = r.userId || r.userName || '?';
    if (!byUser[uid]) byUser[uid] = {name: r.userName||uid, sessions:0, totalScore:0, accs:[], lastDate:0};
    byUser[uid].sessions++;
    byUser[uid].totalScore += r.score;
    byUser[uid].accs.push(r.accuracy);
    if (r.date && new Date(r.date).getTime() > byUser[uid].lastDate) byUser[uid].lastDate = new Date(r.date).getTime();
  });

  // ── Player selector ──
  var userIds = Object.keys(byUser);
  var playerSelectorHtml = '';
  if (userIds.length > 0) {
    playerSelectorHtml = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 1px 6px rgba(0,0,0,.06)">' +
      '<span style="font-size:13px;font-weight:600;color:#555;flex-shrink:0">👤 הצג דוח נהג:</span>' +
      '<select onchange="_renderReportsInner(document.getElementById(\'mc\'),\'' + activeTab + '\',this.value,null)" style="flex:1;padding:7px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px">' +
        '<option value="">— כלל הנהגים —</option>' +
        userIds.map(function(uid){
          var u = byUser[uid];
          return '<option value="' + uid + '"' + (selectedUser===uid?' selected':'') + '>' + u.name + ' (' + u.sessions + ' משחקים)</option>';
        }).join('') +
      '</select>' +
      (selectedUser ? '<button onclick="_renderReportsInner(document.getElementById(\'mc\'),\'' + activeTab + '\',\'\',null)" style="padding:7px 12px;border:1.5px solid #e0e0e0;background:#fff;border-radius:8px;font-size:12px;cursor:pointer;color:#888">✕ הצג הכל</button>' : '') +
    '</div>';
  }

  // ── Specific user ──
  if (selectedUser && byUser[selectedUser]) {
    var u = byUser[selectedUser];
    var userRes = res.filter(function(r){ return (r.userId||r.userName) === selectedUser; });
    var userAvgA = Math.round(u.accs.reduce((s,a)=>s+a,0)/u.accs.length);
    var userBest = Math.max(...userRes.map(r=>r.score));
    var levelColor = userAvgA >= 85 ? '#2dc653' : userAvgA >= 65 ? '#4361ee' : '#f59e0b';
    var levelLbl = userAvgA >= 85 ? 'מומחה' : userAvgA >= 65 ? 'מתקדם' : 'מתחיל';

    mc.innerHTML =
      '<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:14px">' +
        '<h2 style="font-size:20px;font-weight:700">📊 דיווחים</h2>' +
        '<button class="btn-success" onclick="exportCSV(\'' + activeTab + '\')" style="padding:8px 16px;font-size:13px">⬇️ ייצוא CSV</button>' +
      '</div>' + tabStripHtml + playerSelectorHtml +
      '<div style="background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:16px">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">' +
          '<div style="font-size:36px">👤</div>' +
          '<div><div style="font-size:18px;font-weight:800">' + u.name + '</div>' +
          '<div style="font-size:12px;color:#888">' + u.sessions + ' משחקים · שיא ' + userBest + '</div></div>' +
          '<div style="margin-right:auto;text-align:center">' +
            '<div style="font-size:22px;font-weight:800;color:' + levelColor + '">' + userAvgA + '%</div>' +
            '<div style="font-size:11px;font-weight:600;color:' + levelColor + '">' + levelLbl + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-bottom:14px">' +
          '<div style="height:100%;width:' + userAvgA + '%;background:' + levelColor + ';border-radius:3px"></div>' +
        '</div>' +
        '<div class="admin-grid">' +
          '<div class="stat-card"><div class="num">' + u.sessions + '</div><div class="lbl">משחקים</div></div>' +
          '<div class="stat-card"><div class="num">' + userAvgA + '%</div><div class="lbl">דיוק ממוצע</div></div>' +
          '<div class="stat-card"><div class="num">' + userBest + '</div><div class="lbl">ניקוד שיא</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap"><div class="table-head"><h3>היסטוריית משחקים</h3></div>' +
      '<table><thead><tr><th>תאריך</th><th>משחק</th><th>מצב</th><th>ניקוד</th><th>דיוק</th><th>רמה</th></tr></thead>' +
      '<tbody>' + userRes.slice(0,15).map(function(r){
        var modeLabel = r.mode==='study' ? '<span style="font-size:10px;color:#7c3aed;background:#f3e8ff;padding:1px 6px;border-radius:5px">לימוד</span>' :
                        '<span style="font-size:10px;color:#0284c7;background:#e0f2fe;padding:1px 6px;border-radius:5px">אתגר</span>';
        return '<tr>' +
          '<td style="font-size:12px;color:#888">' + (r.date?new Date(r.date).toLocaleDateString('he-IL'):'') + '</td>' +
          '<td style="font-size:12px">' + (r._gameName||r.gameType||'') + '</td>' +
          '<td>' + modeLabel + '</td>' +
          '<td style="font-weight:700">' + r.score + '</td>' +
          '<td>' + r.accuracy + '%</td>' +
          '<td style="font-size:11px;font-weight:600;color:' + (r.level==='מומחה'?'#2dc653':r.level==='מתקדם'?'#4361ee':'#f59e0b') + '">' + (r.level||'') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
    return;
  }

  // ── All users summary ──
  var userTableRows = Object.values(byUser).sort(function(a,b){ return b.sessions-a.sessions; }).map(function(u){
    var uAvg = Math.round(u.accs.reduce((s,a)=>s+a,0)/u.accs.length);
    var barColor = uAvg >= 85 ? '#2dc653' : uAvg >= 65 ? '#4361ee' : '#f59e0b';
    return '<tr>' +
      '<td><b>' + u.name + '</b></td><td>' + u.sessions + '</td><td>' + u.totalScore + '</td>' +
      '<td><div style="display:flex;align-items:center;gap:6px">' +
        '<div style="width:50px;height:5px;background:#eee;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + uAvg + '%;background:' + barColor + ';border-radius:3px"></div></div>' +
        '<span style="font-size:12px;font-weight:700;color:' + barColor + '">' + uAvg + '%</span>' +
      '</div></td>' +
      '<td>' + (u.lastDate?new Date(u.lastDate).toLocaleDateString('he-IL'):'—') + '</td>' +
    '</tr>';
  }).join('');

  mc.innerHTML =
    '<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:14px">' +
      '<h2 style="font-size:20px;font-weight:700">📊 דיווחים</h2>' +
      '<button class="btn-success" onclick="exportCSV(\'' + activeTab + '\')" style="padding:8px 16px;font-size:13px">⬇️ ייצוא CSV</button>' +
    '</div>' + tabStripHtml + playerSelectorHtml +
    '<div class="admin-grid" style="margin-bottom:18px">' +
      '<div class="stat-card"><div class="num">' + total + '</div><div class="lbl">סה"כ משחקים</div></div>' +
      '<div class="stat-card"><div class="num">' + avgS + '</div><div class="lbl">ניקוד ממוצע</div></div>' +
      '<div class="stat-card"><div class="num">' + avgA + '%</div><div class="lbl">דיוק ממוצע</div></div>' +
      '<div class="stat-card"><div class="num">' + userIds.length + '</div><div class="lbl">נהגים</div></div>' +
    '</div>' +
    (userTableRows ? '<div class="table-wrap"><div class="table-head"><h3>לפי נהג</h3></div>' +
      '<table><thead><tr><th>שם</th><th>משחקים</th><th>ניקוד</th><th>דיוק</th><th>פעילות אחרונה</th></tr></thead>' +

    (res.length ? '<div class="table-wrap mt2"><div class="table-head"><h3>תוצאות אחרונות</h3></div>' +

// Unified topic list event delegation — attached once after render
window._utlDelegated = false;
function attachUnifiedTopicListeners() {
  if (window._utlDelegated) return;
  window._utlDelegated = true;
  document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;
    if (action === 'move-topic-up')   { moveTopic(id, -1); }
    else if (action === 'move-topic-dn')   { moveTopic(id,  1); }
    else if (action === 'topic-rename')    { renameTopic(id); }
    else if (action === 'topic-delete')    { confirmDeleteTopic(id); }
    else if (action === 'game-rename')     { renameGame(id); }
    else if (action === 'game-questions')  { showTab('questions'); renderQuestions(document.getElementById('mc'), id); }
    else if (action === 'game-move')       { openMoveGameToTopic(id); }
    else if (action === 'game-delete')     { confirmDeleteGame(id); }
  });
  document.addEventListener('change', function(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    var id = el.dataset.id;
    if (action === 'toggle-topic') { toggleTopicVisibility(el, id); }
    else if (action === 'toggle-game')  { toggleGameVisFromTopic(el, id); }
  });
}
attachUnifiedTopicListeners();

function saveConfig(gameType){
  const cfg={
    imageDisplayTime:parseInt(document.getElementById('si').value),
    answerTime:Math.max(1,parseInt(document.getElementById('sa').value)),
    questionsPerSession:parseInt(document.getElementById('sq').value),
    pointsPerCorrect:parseInt(document.getElementById('sp').value),
    bonusForSpeed:document.getElementById('sb').checked,
    showCountdown:document.getElementById('sc').checked,
    requireName:document.getElementById('srn')?document.getElementById('srn').checked:true
  };
  const sawiEl=document.getElementById('sawi');
  if(sawiEl!==null) cfg.showAnswerWithImage=sawiEl.checked;
  const g = typeof getGame==='function' ? getGame(gameType) : null;
  if(g && g.meta && g.meta.filters && g.meta.filters.indexOf('loc')>=0){
    cfg.filterLocation=document.getElementById('sf-loc')?document.getElementById('sf-loc').value:'הכל';
    cfg.filterDiff=document.getElementById('sf-diff')?document.getElementById('sf-diff').value:'הכל';
  }
  if(typeof setGameSettings==='function' && g) setGameSettings(gameType, cfg);
  else if(gameType==='safety') Object.assign(DB.safetySettings,cfg);
  else Object.assign(DB.settings,cfg);
  const descEl=document.getElementById('game-desc');
  if(g && descEl) g.description=descEl.value.trim();
  saveDB();
  const ok=document.getElementById('save-ok');ok.style.display='inline';setTimeout(()=>ok.style.display='none',2500);
}

function publishSafetySettings(){
  // שמור קודם מקומית

  var s = DB.safetySettings;
  var params = [
    'action=saveSettings',
    'imageDisplayTime=' + s.imageDisplayTime,
    'answerTime=' + s.answerTime,
    'questionsPerSession=' + s.questionsPerSession,
    'pointsPerCorrect=' + s.pointsPerCorrect,
    'bonusForSpeed=' + (s.bonusForSpeed ? 'true' : 'false'),
    'showCountdown=' + (s.showCountdown ? 'true' : 'false'),
    'showAnswerWithImage=' + (s.showAnswerWithImage ? 'true' : 'false'),
    'requireName=' + (s.requireName ? 'true' : 'false'),
    'filterLocation=' + encodeURIComponent(s.filterLocation || 'הכל'),
    'filterDiff=' + encodeURIComponent(s.filterDiff || 'הכל'),
    't=' + Date.now()
  ].join('&');
  var okEl = document.getElementById('publish-ok');
  var saveOkEl = document.getElementById('save-ok');
  // נקה cache כדי שהפעם הבאה יטען מחדש
  _settingsCache = null;

    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.ok){

// Toggle visibility of all games in a topic
window.toggleTopicVisibility = function(checkbox, topicId) {
  var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
  var topic = topics.find(function(t){ return t.id === topicId; });
  if (!topic) return;
  if (!DB.gameHidden) DB.gameHidden = {};
  (topic.gameIds||[]).forEach(function(gid) {
    DB.gameHidden[gid] = !checkbox.checked;
    var gg = typeof getGame==='function' ? getGame(gid) : null;
    if (gg) gg.hidden = !checkbox.checked;
    // Update individual game checkboxes
    var el = document.getElementById('vis-' + gid);
    if (el) el.checked = checkbox.checked;
  });
};

// Toggle visibility of a single game (also updates topic checkbox state)
window.toggleGameVisFromTopic = function(checkbox, gameId) {
  if (!DB.gameHidden) DB.gameHidden = {};
  DB.gameHidden[gameId] = !checkbox.checked;
  var gg = typeof getGame==='function' ? getGame(gameId) : null;
  if (gg) gg.hidden = !checkbox.checked;
  // Update parent topic checkbox
  var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
  topics.forEach(function(t) {
    if ((t.gameIds||[]).indexOf(gameId) >= 0) {
      var allVisible = (t.gameIds||[]).every(function(gid){ return !DB.gameHidden[gid]; });
      var el = document.getElementById('vis-topic-' + t.id);
      if (el) el.checked = allVisible;
    }
  });
};

      align: (typeof window._wmCurrentAlign !== 'undefined') ? window._wmCurrentAlign : ((DB.welcomeMsg&&DB.welcomeMsg.align)||'center')
    };
  }
  if(!DB.gameHidden) DB.gameHidden={};

  var allGames = typeof getAllGames==='function' ? getAllGames() : [];
  allGames.forEach(function(g){

function moveTopic(topicId, dir) {
  var topics = typeof window.getTopics === 'function' ? window.getTopics() : [];
  var idx = topics.findIndex(function(t){ return t.id === topicId; });
  if (idx === -1) return;
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= topics.length) return;
  var tmp = topics.splice(idx, 1)[0];
  topics.splice(newIdx, 0, tmp);
  DB.topics = topics;
  saveDB();
  var el = document.getElementById('unified-topics-list');
  if (el) el.innerHTML = buildUnifiedTopicList();
  var el2 = document.getElementById('order-list');
  if (el2) el2.innerHTML = buildOrderList();
}

function moveGame(id, dir){
  if(DB.games && DB.games.length){
    const sorted=getGamesSorted?getGamesSorted():DB.games;
    const idx=sorted.findIndex(g=>g.id===id);
    if(idx===-1)return;
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=sorted.length)return;
    const a=sorted[idx], b=sorted[newIdx];
    const tmp=a.order; a.order=b.order; b.order=tmp;
    if(typeof syncLegacyFromGames==='function') syncLegacyFromGames();
  } else {
    const idx=DB.gameOrder.indexOf(id);
    if(idx===-1)return;
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=DB.gameOrder.length)return;
    DB.gameOrder.splice(idx,1);
    DB.gameOrder.splice(newIdx,0,id);
  }
  saveDB();
  renderConfig(document.getElementById('mc'),'general');
}

document.addEventListener('wheel', function(e) {
  const modal = document.getElementById('modal');
  if(!modal || modal.classList.contains('hidden')) return;
  if(!_editSQCurrent) return;
  const allQ = (DB.safetyQuestions||[]).filter(q=>q&&q.id);
  const idx = allQ.findIndex(q=>q.id===_editSQCurrent);
  if(idx<0) return;
  let newIdx = e.deltaY > 0 ? idx+1 : idx-1;
  if(newIdx < 0 || newIdx >= allQ.length) return;
  e.preventDefault();
  modal.classList.add('hidden');
  if(allQ[newIdx]) editSQ(allQ[newIdx].id);
}, {passive:false});

// Export function
function exportFullHTML(){
  var ok=document.getElementById('save-ok');
  if(ok){ok.textContent='...';ok.style.display='inline';}
  setTimeout(function(){
    try{
      DB._version=DB_VERSION;
      var dbStr=JSON.stringify(DB);
      var html=document.documentElement.outerHTML;
      var m1='let DB = _rawDB || {';
      var m2='\n// __DB_END__';
      var i1=html.indexOf(m1);
      var i2=html.indexOf(m2);
      if(i1<0||i2<0){alert('export error: markers not found i1='+i1+' i2='+i2);return;}
      var oldBlock=html.substring(i1,i2);
      var newBlock='let DB='+dbStr+';';
      html=html.replace(oldBlock,newBlock);
      var enc=new TextEncoder();
      var bytes=enc.encode('<!DOCTYPE html>\n'+html);
      var blob=new Blob([bytes],{type:'text/html;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      var d=new Date();
      var ts=d.getFullYear()+''+('0'+(d.getMonth()+1)).slice(-2)+''+('0'+d.getDate()).slice(-2)+'_'+('0'+d.getHours()).slice(-2)+''+('0'+d.getMinutes()).slice(-2);
      a.download='blossom_'+ts+'.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if(ok){ok.textContent='OK';setTimeout(function(){ok.style.display='none';},2000);}
    }catch(e){alert('err:'+e.message);if(ok)ok.style.display='none';}
  },50);
}

  function migrateDBPlatform() {
    if (!DB.gameTemplates) DB.gameTemplates = JSON.parse(JSON.stringify(GAME_TEMPLATES));
    // Ensure driver games are in DB.games array (they may have been added to DB directly)
    if (DB.questionsByGame) {
      var knownIds = ['hours','load','vehicle','weather','documents'];
      knownIds.forEach(function(id) {
        if (!DB.questionsByGame[id]) DB.questionsByGame[id] = [];
        if (!DB.resultsByGame) DB.resultsByGame = {};
        if (!DB.resultsByGame[id]) DB.resultsByGame[id] = [];
      });
    }

    if (!DB.questionsByGame) {
      DB.questionsByGame = {
        safety: DB.safetyQuestions || [],
        game: DB.questions || []
      };
    }
    if (!DB.resultsByGame) {
      DB.resultsByGame = {
        safety: DB.safetyResults || [],
        game: DB.results || []
      };
    }

    if (!DB.games || !DB.games.length) {
      const safetyG = buildBuiltinSafetyGame();
      const demoG = buildBuiltinDemoGame();
      safetyG.order = safetyG.order < 0 ? 0 : safetyG.order;
      demoG.order = demoG.order < 0 ? 1 : demoG.order;
      DB.games = [safetyG, demoG];
      DB._platformVersion = '4.0';
    } else {
      // Ensure builtin games always exist in DB.games even if array was partially populated
      var hasS = DB.games.some(function(g){return g.id==='safety';});
      var hasG = DB.games.some(function(g){return g.id==='game';});
      if (!hasS) { var sg = buildBuiltinSafetyGame(); sg.order = 0; DB.games.unshift(sg); }
      if (!hasG) { var dg = buildBuiltinDemoGame(); dg.order = 1; DB.games.splice(1,0,dg); }
    }
    // Always force-show builtin games
    DB.games.forEach(function(g) {
      if (g.id === 'safety' || g.id === 'game') g.hidden = false;
    });
    if (DB.gameHidden) { DB.gameHidden['safety'] = false; DB.gameHidden['game'] = false; }

    DB.games.forEach(function (g, i) {
      if (g.order == null) g.order = i;
      if (!g.templateId) g.templateId = 'image_timed';
      if (!g.settings) g.settings = cloneSettings();
      if (!g.meta) g.meta = {};
      if (!g.answerConfig) g.answerConfig = { prompt: '?' };
      if (!DB.questionsByGame[g.id]) DB.questionsByGame[g.id] = [];
      if (!DB.resultsByGame[g.id]) DB.resultsByGame[g.id] = [];
      if (!g.description) g.description = defaultGameDescription(g);
    });

    syncLegacyAliases();
    syncLegacyFromGames();

  function startTextQuizGame(game) {
    var mc = document.getElementById('mc');
    mc.classList.add('fullscreen-game');
    var qs = getGameQuestions(game.id).filter(function(q){return q&&q.active;});
    if (!qs.length) { alert('אין שאלות פעילות במשחק זה! הוסף שאלות בטאב "שאלות".'); return; }
    var s = getGameSettings(game);
    var selected = qs.sort(function(){return Math.random()-.5;}).slice(0, Math.min(s.questionsPerSession||15, qs.length));
    var state = { gameId: game.id, game: game, questions: selected, current: 0, score: 0, correct: 0, startTimes: {} };
    var shellId = 'sgp';
    var existing = document.getElementById(shellId);
    if (!existing) { mc.innerHTML = '<div class="game-wrapper"><div class="card" id="' + shellId + '"></div></div>'; }
    
    function renderTQQuestion() {
      var shell = document.getElementById(shellId);
      if (!shell) return;
      if (state.current >= state.questions.length) { endTQGame(); return; }
      var q = state.questions[state.current];
      var total = state.questions.length;
      var pct = Math.round((state.current/total)*100);
      var opts = q.options ? q.options.slice() : [];
      var shuffle = [0,1,2,3].slice(0,opts.length).sort(function(){return Math.random()-.5;});
      var dOpts = shuffle.map(function(i){return opts[i];});
      q._dc = shuffle.indexOf(q.correct||0);
      var studyBadge = window._studyMode ? '<span class="study-mode-badge">מצב לימוד</span>' : '';
      shell.innerHTML = 
        '<div class="progress-row"><span class="progress-label">שאלה ' + (state.current+1) + '/' + total + '</span><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-label">⭐ ' + state.score + '</span></div>' +
        '<div class="question-text" style="margin-bottom:18px">' + studyBadge + q.text + '</div>' +
        '<div class="answer-grid" id="tq-grid">' +
          dOpts.map(function(opt,i){return '<button class="answer-btn" onclick="window._tqPick(' + i + ')">' + opt + '</button>';}).join('') +
        '</div>' +
        '<div id="tq-exp" class="explanation-box"></div>';
    }

    window._tqPick = function(idx) {
      var q = state.questions[state.current];
      var ok = idx === q._dc;
      document.querySelectorAll('#tq-grid button').forEach(function(b,i){
        b.disabled = true;
        if (i === q._dc) b.classList.add('correct');
        else if (i === idx && !ok) b.classList.add('wrong');
      });
      var pts = getGameSettings(game).pointsPerCorrect || 10;
      if (ok) { state.score += pts; state.correct++; }
      // Track per-question result: '1'=correct, '0'=wrong
      if (!state.questionLog) state.questionLog = [];
      state.questionLog.push({ qid: q.id, text: q.text, ok: ok });
      if (q.explanation && window._studyMode) {
        window.showExplanationBubble(q.explanation, ok, function() {
          state.current++;
          renderTQQuestion();
        });
      } else {
        setTimeout(function(){ state.current++; renderTQQuestion(); }, 1300);
      }
    };

    function endTQGame() {
      mc.classList.remove('fullscreen-game');
      var shell = document.getElementById(shellId);
      if (!shell) return;
      var total = state.questions.length, correct = state.correct, acc = Math.round((correct/total)*100);
      var level = 'מתחיל', lc = 'badge-warning';
      if (acc>=85){level='מומחה';lc='badge-success';}else if(acc>=65){level='מתקדם';lc='badge-info';}
      // Build answerDetail: "שאלה:1,שאלה:0,..." (1=correct, 0=wrong)
      var answerDetail = (state.questionLog || []).map(function(entry) {
        return encodeURIComponent(entry.text.substring(0,30)) + ':' + (entry.ok ? '1' : '0');

    }

    if (typeof showGameExitButton==='function') {
      showGameExitButton();
      // Override exit button to go back to text quiz lobby
      var exitBtn2 = document.getElementById('game-exit-btn');

  function renderMultiStreamLobby(mc, game) {
